name: knowledge-platform-quality

on:
  push:
    branches: ["通用知识库平台"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q app tests
      - name: Modern chain tests
        run: PYTHONPATH=. python tests/test_modern_chain.py
      - name: Graph isolation tests
        run: PYTHONPATH=. python tests/test_graph_reasoning.py
      - name: Compliance governance tests
        run: PYTHONPATH=. python tests/test_compliance_workflow.py
      - name: Stage2 workflow tests
        run: PYTHONPATH=. python tests/test_stage2_workflow.py
      - name: Stage3 governed graph tests
        run: PYTHONPATH=. python tests/test_stage3_graph_governance.py
      - name: Stage4 GraphRAG backend tests
        run: PYTHONPATH=. python tests/test_stage4_graphrag_backend.py
      - name: Stage5 customer demo tests
        run: PYTHONPATH=. python tests/test_stage5_demo_scenario.py
      - name: Stage6 document and model admin tests
        run: PYTHONPATH=. python tests/test_stage6_document_model_admin.py
      - name: Stage7 business navigation tests
        run: PYTHONPATH=. python tests/test_stage7_business_navigation.py
      - name: Stage8 ontology graph visualization tests
        run: PYTHONPATH=. python tests/test_stage8_business_ontology_graph.py
      - name: Stage9 formal catalog tests
        run: PYTHONPATH=. python tests/test_stage9_formal_catalog.py
      - name: Stage10 formal knowledge maintenance tests
        run: PYTHONPATH=. python tests/test_stage10_formal_knowledge_maintenance.py
      - name: Stage11 regulation change monitoring tests
        run: PYTHONPATH=. python tests/test_stage11_change_monitor.py
      - name: Stage12 business regulation map tests
        run: PYTHONPATH=. python tests/test_stage12_business_map.py
      - name: Stage13 ontology governance tests
        run: PYTHONPATH=. python tests/test_stage13_ontology_governance.py
      - name: Stage14 target market tests
        run: PYTHONPATH=. python tests/test_stage14_target_markets.py
      - name: Stage15 source registry tests
        run: PYTHONPATH=. python tests/test_stage15_source_registry.py
      - name: Stage16 source collection tests
