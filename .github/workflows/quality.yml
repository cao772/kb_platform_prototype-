name: knowledge-platform-quality

on:
  push:
    branches: ["通用知识库平台"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q app tests
      - name: Modern chain tests
        run: PYTHONPATH=. python tests/test_modern_chain.py
      - name: Graph isolation tests
        run: PYTHONPATH=. python tests/test_graph_reasoning.py
      - name: Compliance governance tests
        run: PYTHONPATH=. python tests/test_compliance_workflow.py
      - name: Stage2 workflow tests
        run: PYTHONPATH=. python tests/test_stage2_workflow.py
      - name: Stage3 governed graph tests
        run: PYTHONPATH=. python tests/test_stage3_graph_governance.py
      - name: Stage4 GraphRAG backend tests
        run: PYTHONPATH=. python tests/test_stage4_graphrag_backend.py
      - name: Stage5 customer demo tests
        run: PYTHONPATH=. python tests/test_stage5_demo_scenario.py
      - name: Stage6 document and model admin tests
        run: PYTHONPATH=. python tests/test_stage6_document_model_admin.py
      - name: Stage7 business navigation tests
        run: PYTHONPATH=. python tests/test_stage7_business_navigation.py
      - name: Stage8 ontology graph visualization tests
        run: PYTHONPATH=. python tests/test_stage8_business_ontology_graph.py
