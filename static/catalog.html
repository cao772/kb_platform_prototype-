<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>正式知识目录 · 法规认证知识平台</title>
<style>
:root{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;color:#17243a;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}.top{height:64px;background:#0a2e5e;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 28px}.top a{color:#dceafb;text-decoration:none;font-size:13px}.brand{font-size:19px;font-weight:700}.wrap{max-width:1500px;margin:18px auto;padding:0 20px}.hero{background:linear-gradient(125deg,#103d78,#0d608b);color:#fff;border-radius:16px;padding:24px 27px;margin-bottom:14px}.hero h1{margin:0 0 7px;font-size:25px}.hero p{margin:0;color:#dceafb;line-height:1.7;max-width:980px}.metrics{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;margin-bottom:14px}.metric,.card{background:#fff;border:1px solid #e1e7ef;border-radius:12px;box-shadow:0 4px 14px #19304b0a}.metric{padding:13px 14px;cursor:pointer}.metric:hover{border-color:#7aa6d0}.metric.active{border-color:#0d4f91;background:#f3f8fd}.metric span{font-size:11px;color:#7d8999}.metric strong{display:block;font-size:22px;color:#123d6c;margin-top:2px}.card{padding:16px}.filters{display:grid;grid-template-columns:1.5fr 150px 130px 180px 150px 150px 140px auto;gap:8px;align-items:end}.filters label{display:block;font-size:11px;color:#718095;margin-bottom:5px}input,select{width:100%;border:1px solid #cad4e1;border-radius:8px;padding:9px 10px;background:#fff;font:inherit}.btn{border:0;border-radius:8px;background:#0d4f91;color:#fff;padding:9px 14px;cursor:pointer;white-space:nowrap}.btn.secondary{background:#eef4fb;color:#0d4f91}.layout{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(340px,.55fr);gap:14px;margin-top:14px}.list{display:flex;flex-direction:column;gap:8px;max-height:720px;overflow:auto}.item{border:1px solid #dfe6ef;border-radius:10px;padding:11px;background:#fff;cursor:pointer}.item:hover,.item.active{border-color:#76a1ca;background:#f8fbff}.item-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.item h3{font-size:14px;margin:0;line-height:1.45}.meta{font-size:11px;color:#7e8a9a;line-height:1.6;margin-top:5px}.pill{display:inline-block;border-radius:999px;padding:3px 7px;font-size:10px;background:#edf3f8;color:#52657a;margin-right:5px}.pill.active{background:#eaf8f0;color:#2c7551}.pill.transition{background:#fff3df;color:#956313}.pill.future,.pill.unknown{background:#eef1f5;color:#637083}.pill.repealed,.pill.withdrawn,.pill.superseded,.pill.expired{background:#fcecec;color:#9e3e3e}.type.regulation{background:#e9f2fb;color:#386fa4}.type.standard{background:#eaf5ef;color:#39765a}.type.certification{background:#fff1e3;color:#a55f22}.type.requirement{background:#f2ecf8;color:#76548d}.type.test_item{background:#f8eaee;color:#96505d}.detail{min-height:620px}.detail h2{font-size:18px;margin:0 0 4px}.detail .code{font-size:12px;color:#718095}.section{border-top:1px solid #e7ecf2;margin-top:14px;padding-top:13px}.section h3{font-size:13px;margin:0 0 8px}.row{display:grid;grid-template-columns:120px 1fr;gap:8px;font-size:12px;line-height:1.65;margin-top:5px}.row b{color:#68778b}.note{background:#f6f9fc;border-radius:8px;padding:10px;font-size:12px;color:#5e6e82;line-height:1.65;white-space:pre-wrap}.version{border-left:3px solid #7aa5cf;background:#f8fafc;border-radius:0 8px 8px 0;padding:8px 10px;margin:7px 0;font-size:12px}.relation{background:#f7f9fc;border:1px solid #e3e9f0;border-radius:8px;padding:8px 10px;margin:7px 0;font-size:12px}.empty{color:#7c8999;font-size:13px;padding:24px;text-align:center}.headbar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:11px}.headbar h2{margin:0;font-size:16px}.count{font-size:12px;color:#768397}@media(max-width:1200px){.metrics{grid-template-columns:repeat(3,1fr)}.filters{grid-template-columns:1fr 1fr 1fr 1fr}.layout{grid-template-columns:1fr}}@media(max-width:650px){.top{padding:0 14px}.wrap{padding:0 12px}.metrics{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr}.row{grid-template-columns:1fr}.hero h1{font-size:21px}}
</style>
</head>
<body>
<div class="top"><div class="brand">正式知识目录</div><a href="/">← 返回法规认证知识平台</a></div>
<div class="wrap">
  <div class="hero"><h1>法规、标准、认证与要求统一台账</h1><p>这里只展示已经人工确认并进入正式知识库的内容。可以按国家地区、产品分类、有效状态和时间查询，并查看版本沿革、原始依据以及与其他知识项的关联关系。</p></div>
  <div class="metrics">
    <div class="metric active" data-type="" onclick="chooseType('')"><span>全部正式知识</span><strong id="mAll">-</strong></div>
    <div class="metric" data-type="regulation" onclick="chooseType('regulation')"><span>法规库</span><strong id="mReg">-</strong></div>
    <div class="metric" data-type="standard" onclick="chooseType('standard')"><span>标准库</span><strong id="mStd">-</strong></div>
    <div class="metric" data-type="certification" onclick="chooseType('certification')"><span>认证库</span><strong id="mCert">-</strong></div>
    <div class="metric" data-type="requirement" onclick="chooseType('requirement')"><span>技术要求库</span><strong id="mReq">-</strong></div>
    <div class="metric" data-type="test_item" onclick="chooseType('test_item')"><span>检测项目库</span><strong id="mTest">-</strong></div>
  </div>

  <div class="card">
    <div class="filters">
      <div><label>名称 / 编号 / 关键词</label><input id="q" placeholder="例如：家用电器、安全、认证编号"></div>
      <div><label>知识类别</label><select id="type"><option value="">全部</option><option value="regulation">法规</option><option value="standard">标准</option><option value="certification">认证</option><option value="requirement">技术要求</option><option value="test_item">检测项目</option></select></div>
      <div><label>国家/地区</label><input id="region" placeholder="如 EU"></div>
      <div><label>产品分类</label><input id="productClass" placeholder="如 家用电器"></div>
      <div><label>当前状态</label><select id="lifecycle"><option value="">全部</option><option value="active">生效</option><option value="transition">过渡期</option><option value="future">尚未生效</option><option value="expired">已过期</option><option value="repealed">废止</option><option value="withdrawn">撤回</option><option value="superseded">被替代</option><option value="unknown">待确认</option></select></div>
      <div><label>依据情况</label><select id="evidence"><option value="">全部</option><option value="with">已有原始依据</option><option value="without">待补充依据</option></select></div>
      <div><label>判断日期</label><input id="asOf" type="date"></div>
      <button class="btn" onclick="loadCatalog()">查询</button>
    </div>
  </div>

  <div class="layout">
    <div class="card"><div class="headbar"><h2>知识台账</h2><span id="resultCount" class="count">正在加载…</span></div><div id="catalogList" class="list"></div></div>
    <div class="card detail"><div id="detailBox" class="empty">点击左侧任一知识项查看详细信息。</div></div>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const today=new Date().toISOString().slice(0,10);$('asOf').value=today;let items=[],selectedId=null;
async function api(url){const r=await fetch(url);let d={};try{d=await r.json()}catch(e){throw new Error('服务返回格式异常')}if(!r.ok||d.error)throw new Error(d.error||`HTTP ${r.status}`);return d}
function typeLabel(v){return{regulation:'法规',standard:'标准',certification:'认证',requirement:'技术要求',test_item:'检测项目'}[v]||v}function lifeLabel(v){return{active:'生效',transition:'过渡期',future:'尚未生效',expired:'已过期',repealed:'废止',withdrawn:'撤回',superseded:'被替代',unknown:'待确认',date_invalid:'日期异常'}[v]||v}
function chooseType(type){$('type').value=type;document.querySelectorAll('.metric').forEach(x=>x.classList.toggle('active',x.dataset.type===type));loadCatalog()}
function queryString(){return new URLSearchParams({q:$('q').value.trim(),type:$('type').value,region:$('region').value.trim(),product_class:$('productClass').value.trim(),lifecycle:$('lifecycle').value,evidence:$('evidence').value,as_of:$('asOf').value,limit:'800'}).toString()}
async function loadCatalog(){try{const d=await api('/api/catalog?'+queryString()),c=d.summary.type_counts||{};items=d.items||[];$('mAll').textContent=d.summary.total||0;$('mReg').textContent=c.regulation||0;$('mStd').textContent=c.standard||0;$('mCert').textContent=c.certification||0;$('mReq').textContent=c.requirement||0;$('mTest').textContent=c.test_item||0;$('resultCount').textContent=`符合条件 ${d.summary.filtered||0} 条 · 原始依据覆盖 ${(Number(d.summary.evidence_coverage||0)*100).toFixed(0)}%`;renderList();if(selectedId&&!items.some(x=>Number(x.id)===Number(selectedId))){selectedId=null;$('detailBox').innerHTML='<div class="empty">当前筛选条件下未包含之前选择的知识项。</div>'}}catch(e){$('catalogList').innerHTML='<div class="empty">加载失败：'+esc(e.message)+'</div>'}}
function renderList(){const box=$('catalogList');if(!items.length){box.innerHTML='<div class="empty">当前条件下暂无正式知识。</div>';return}box.innerHTML=items.map(x=>`<div class="item ${Number(selectedId)===Number(x.id)?'active':''}" onclick="showDetail(${Number(x.id)})"><div class="item-head"><div><span class="pill type ${esc(x.record_type)}">${esc(typeLabel(x.record_type))}</span><span class="pill ${esc(x.lifecycle_state)}">${esc(lifeLabel(x.lifecycle_state))}</span></div><span class="meta">${x.evidence_backed?'已有依据':'待补依据'}</span></div><h3>${esc(x.code||'')} ${esc(x.name)}</h3><div class="meta">${esc(x.region_name||x.region_code||'未标注地区')} · ${esc(x.product_class||'未标注产品分类')} · 版本 ${esc(x.version||'未标注')}</div><div class="meta">有效时间：${esc(x.effective_from||'未标注')} ～ ${esc(x.effective_to||'长期/未标注')} · 来源：${esc(x.source_filename||'未关联')}</div></div>`).join('')}
async function showDetail(id){selectedId=id;renderList();const box=$('detailBox');box.innerHTML='<div class="empty">正在加载详情…</div>';try{const d=await api(`/api/catalog/detail?id=${encodeURIComponent(id)}&as_of=${encodeURIComponent($('asOf').value)}`),x=d.item||{},a=x.attributes||{};let html=`<div><span class="pill type ${esc(x.record_type)}">${esc(typeLabel(x.record_type))}</span><span class="pill ${esc(x.lifecycle_state)}">${esc(lifeLabel(x.lifecycle_state))}</span></div><h2 style="margin-top:9px">${esc(x.name||'未命名')}</h2><div class="code">${esc(x.code||'未标注编号')} · 版本 ${esc(x.version||'未标注')}</div><div class="section"><div class="row"><b>国家/地区</b><span>${esc(x.region_name||x.region_code||'未标注')}</span></div><div class="row"><b>产品分类</b><span>${esc(x.product_class||'未标注')}</span></div><div class="row"><b>有效时间</b><span>${esc(x.effective_from||'未标注')} ～ ${esc(x.effective_to||'长期/未标注')}</span></div><div class="row"><b>主管机构</b><span>${esc(x.authority||'未标注')}</span></div><div class="row"><b>法律/业务效力</b><span>${esc(x.legal_effect||'未标注')}</span></div></div>`;
if(x.applicability_scope||x.exceptions||x.transition_note){html+=`<div class="section"><h3>适用范围与特殊条件</h3>${x.applicability_scope?`<div class="note"><b>适用范围</b>\n${esc(x.applicability_scope)}</div>`:''}${x.exceptions?`<div class="note" style="margin-top:7px"><b>例外条件</b>\n${esc(x.exceptions)}</div>`:''}${x.transition_note?`<div class="note" style="margin-top:7px"><b>过渡说明</b>\n${esc(x.transition_note)}</div>`:''}</div>`}
html+=`<div class="section"><h3>原始依据</h3><div class="row"><b>来源文件</b><span>${esc(x.source_filename||'未关联')}</span></div><div class="row"><b>文件位置</b><span>${x.source_chunk_index!=null?'第 '+esc(x.source_chunk_index)+' 个内容片段':'未标注'}</span></div>${x.source_url?`<div class="row"><b>来源地址</b><span>${esc(x.source_url)}</span></div>`:''}${d.evidence_excerpt?`<div class="note" style="margin-top:8px">${esc(d.evidence_excerpt)}</div>`:'<div class="note" style="margin-top:8px">当前知识项尚未关联可展示的原始内容片段。</div>'}</div>`;
html+=`<div class="section"><h3>版本沿革</h3>${(d.version_history||[]).map(v=>`<div class="version"><b>${esc(v.version||'未标版本')} · ${esc(lifeLabel(v.lifecycle_state))}</b><div class="meta">${esc(v.effective_from||'未标注')} ～ ${esc(v.effective_to||'长期/未标注')}</div></div>`).join('')||'<div class="meta">暂无其他版本。</div>'}</div>`;
html+=`<div class="section"><h3>关联关系</h3>${(d.relations||[]).map(r=>`<div class="relation">${Number(r.source_record_id)===Number(id)?`本知识项 <b>${esc(r.relation_label)}</b> ${esc(r.target_name||r.target_code)}`:`${esc(r.source_name||r.source_code)} <b>${esc(r.relation_label)}</b> 本知识项`}</div>`).join('')||'<div class="meta">暂无已确认关联关系。</div>'}<div style="margin-top:10px"><a class="btn secondary" href="/graph" style="text-decoration:none;display:inline-block">到知识图谱查看</a></div></div>`;box.innerHTML=html}catch(e){box.innerHTML='<div class="empty">详情加载失败：'+esc(e.message)+'</div>'}}
['q','region','productClass'].forEach(id=>$(id).addEventListener('keydown',e=>{if(e.key==='Enter')loadCatalog()}));$('type').addEventListener('change',()=>{document.querySelectorAll('.metric').forEach(x=>x.classList.toggle('active',x.dataset.type===$('type').value));loadCatalog()});$('lifecycle').addEventListener('change',loadCatalog);$('evidence').addEventListener('change',loadCatalog);$('asOf').addEventListener('change',loadCatalog);loadCatalog();
</script>
</body>
</html>
