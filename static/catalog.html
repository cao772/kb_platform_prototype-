<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>正式知识目录 · 法规认证知识平台</title>
<style>
:root{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;color:#17243a;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}.top{height:64px;background:#0a2e5e;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 28px}.top a{color:#dceafb;text-decoration:none;font-size:13px}.brand{font-size:19px;font-weight:700}.wrap{max-width:1540px;margin:18px auto;padding:0 20px}.hero{background:linear-gradient(125deg,#103d78,#0d608b);color:#fff;border-radius:16px;padding:24px 27px;margin-bottom:14px}.hero h1{margin:0 0 7px;font-size:25px}.hero p{margin:0;color:#dceafb;line-height:1.7;max-width:1050px}.metrics{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;margin-bottom:14px}.metric,.card{background:#fff;border:1px solid #e1e7ef;border-radius:12px;box-shadow:0 4px 14px #19304b0a}.metric{padding:13px 14px;cursor:pointer}.metric:hover{border-color:#7aa6d0}.metric.active{border-color:#0d4f91;background:#f3f8fd}.metric span{font-size:11px;color:#7d8999}.metric strong{display:block;font-size:22px;color:#123d6c;margin-top:2px}.card{padding:16px}.filters{display:grid;grid-template-columns:1.5fr 150px 130px 180px 150px 150px 140px auto;gap:8px;align-items:end}.filters label,.field label{display:block;font-size:11px;color:#718095;margin-bottom:5px}input,select,textarea{width:100%;border:1px solid #cad4e1;border-radius:8px;padding:9px 10px;background:#fff;font:inherit}textarea{min-height:88px;resize:vertical}.btn{border:0;border-radius:8px;background:#0d4f91;color:#fff;padding:9px 14px;cursor:pointer;white-space:nowrap}.btn.secondary{background:#eef4fb;color:#0d4f91}.btn.warn{background:#fff1df;color:#8a5b14}.btn.danger{background:#fcecec;color:#9e3e3e}.btn:disabled{opacity:.5;cursor:not-allowed}.layout{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(390px,.65fr);gap:14px;margin-top:14px}.list{display:flex;flex-direction:column;gap:8px;max-height:760px;overflow:auto}.item{border:1px solid #dfe6ef;border-radius:10px;padding:11px;background:#fff;cursor:pointer}.item:hover,.item.active{border-color:#76a1ca;background:#f8fbff}.item-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.item h3{font-size:14px;margin:0;line-height:1.45}.meta{font-size:11px;color:#7e8a9a;line-height:1.6;margin-top:5px}.pill{display:inline-block;border-radius:999px;padding:3px 7px;font-size:10px;background:#edf3f8;color:#52657a;margin-right:5px}.pill.active{background:#eaf8f0;color:#2c7551}.pill.transition{background:#fff3df;color:#956313}.pill.future,.pill.unknown,.pill.draft{background:#eef1f5;color:#637083}.pill.repealed,.pill.withdrawn,.pill.superseded,.pill.expired{background:#fcecec;color:#9e3e3e}.type.regulation{background:#e9f2fb;color:#386fa4}.type.standard{background:#eaf5ef;color:#39765a}.type.certification{background:#fff1e3;color:#a55f22}.type.requirement{background:#f2ecf8;color:#76548d}.type.test_item{background:#f8eaee;color:#96505d}.detail{min-height:650px}.detail h2{font-size:18px;margin:0 0 4px}.detail .code{font-size:12px;color:#718095}.section{border-top:1px solid #e7ecf2;margin-top:14px;padding-top:13px}.section h3{font-size:13px;margin:0 0 8px}.row{display:grid;grid-template-columns:120px 1fr;gap:8px;font-size:12px;line-height:1.65;margin-top:5px}.row b{color:#68778b}.note{background:#f6f9fc;border-radius:8px;padding:10px;font-size:12px;color:#5e6e82;line-height:1.65;white-space:pre-wrap}.version{border-left:3px solid #7aa5cf;background:#f8fafc;border-radius:0 8px 8px 0;padding:8px 10px;margin:7px 0;font-size:12px}.relation{background:#f7f9fc;border:1px solid #e3e9f0;border-radius:8px;padding:8px 10px;margin:7px 0;font-size:12px}.empty{color:#7c8999;font-size:13px;padding:24px;text-align:center}.headbar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:11px}.headbar h2{margin:0;font-size:16px}.count{font-size:12px;color:#768397}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.audit{border-left:3px solid #99aac0;background:#f8fafc;padding:9px 10px;margin:7px 0;border-radius:0 8px 8px 0}.audit b{font-size:12px}.audit .meta{margin-top:3px}.modal-mask{position:fixed;inset:0;background:#10233b66;display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal-mask.show{display:flex}.modal{width:min(820px,96vw);max-height:92vh;overflow:auto;background:#fff;border-radius:14px;box-shadow:0 18px 50px #10233b33;padding:18px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.modal-head h2{margin:0;font-size:18px}.close{border:0;background:#eef2f6;color:#53657a;border-radius:8px;padding:7px 10px;cursor:pointer}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field.wide{grid-column:1/-1}.check{display:flex;align-items:center;gap:7px;font-size:12px;color:#59697c}.check input{width:auto}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.hint{font-size:11px;color:#7d8999;line-height:1.6;margin-top:4px}@media(max-width:1200px){.metrics{grid-template-columns:repeat(3,1fr)}.filters{grid-template-columns:1fr 1fr 1fr 1fr}.layout{grid-template-columns:1fr}}@media(max-width:650px){.top{padding:0 14px}.wrap{padding:0 12px}.metrics{grid-template-columns:1fr 1fr}.filters,.form-grid{grid-template-columns:1fr}.field.wide{grid-column:auto}.row{grid-template-columns:1fr}.hero h1{font-size:21px}}
</style>
</head>
<body>
<div class="top"><div class="brand">正式知识目录</div><a href="/">← 返回法规认证知识平台</a></div>
<div class="wrap">
  <div class="hero"><h1>法规、标准、认证与要求统一台账</h1><p>这里管理已经人工确认并进入正式知识库的内容。除查询版本、依据和关联关系外，还可以继续维护内容、调整状态、新增替代版本、补充原始依据，并保留每一次修改记录。</p></div>
  <div class="metrics">
    <div class="metric active" data-type="" onclick="chooseType('')"><span>全部正式知识</span><strong id="mAll">-</strong></div>
    <div class="metric" data-type="regulation" onclick="chooseType('regulation')"><span>法规库</span><strong id="mReg">-</strong></div>
    <div class="metric" data-type="standard" onclick="chooseType('standard')"><span>标准库</span><strong id="mStd">-</strong></div>
    <div class="metric" data-type="certification" onclick="chooseType('certification')"><span>认证库</span><strong id="mCert">-</strong></div>
    <div class="metric" data-type="requirement" onclick="chooseType('requirement')"><span>技术要求库</span><strong id="mReq">-</strong></div>
    <div class="metric" data-type="test_item" onclick="chooseType('test_item')"><span>检测项目库</span><strong id="mTest">-</strong></div>
  </div>

  <div class="card">
    <div class="filters">
      <div><label>名称 / 编号 / 关键词</label><input id="q" placeholder="例如：家用电器、安全、认证编号"></div>
      <div><label>知识类别</label><select id="type"><option value="">全部</option><option value="regulation">法规</option><option value="standard">标准</option><option value="certification">认证</option><option value="requirement">技术要求</option><option value="test_item">检测项目</option></select></div>
      <div><label>国家/地区</label><input id="region" placeholder="如 EU"></div>
      <div><label>产品分类</label><input id="productClass" placeholder="如 家用电器"></div>
      <div><label>当前状态</label><select id="lifecycle"><option value="">全部</option><option value="active">生效</option><option value="transition">过渡期</option><option value="future">尚未生效</option><option value="expired">已过期</option><option value="repealed">废止</option><option value="withdrawn">撤回</option><option value="superseded">被替代</option><option value="unknown">待确认</option></select></div>
      <div><label>依据情况</label><select id="evidence"><option value="">全部</option><option value="with">已有原始依据</option><option value="without">待补充依据</option></select></div>
      <div><label>判断日期</label><input id="asOf" type="date"></div>
      <button class="btn" onclick="loadCatalog()">查询</button>
    </div>
  </div>

  <div class="layout">
    <div class="card"><div class="headbar"><h2>知识台账</h2><span id="resultCount" class="count">正在加载…</span></div><div id="catalogList" class="list"></div></div>
    <div class="card detail"><div id="detailBox" class="empty">点击左侧任一知识项查看详细信息和维护记录。</div></div>
  </div>
</div>

<div id="modalMask" class="modal-mask" onclick="maskClose(event)"><div class="modal" onclick="event.stopPropagation()"><div class="modal-head"><h2 id="modalTitle">知识维护</h2><button class="close" onclick="closeModal()">关闭</button></div><div id="modalBody"></div><div class="modal-actions"><button class="btn secondary" onclick="closeModal()">取消</button><button id="modalSave" class="btn" onclick="saveModal()">保存</button></div></div></div>

<script>
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[c]));const today=new Date().toISOString().slice(0,10);$('asOf').value=today;let items=[],selectedId=null,currentDetail=null,currentHistory=[],modalMode='';
async function api(url,opt){const r=await fetch(url,opt);let d={};try{d=await r.json()}catch(e){throw new Error('服务返回格式异常')}if(!r.ok||d.error)throw new Error(d.error||`HTTP ${r.status}`);return d}
function post(url,body){return api(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})}
function typeLabel(v){return{regulation:'法规',standard:'标准',certification:'认证',requirement:'技术要求',test_item:'检测项目'}[v]||v}function lifeLabel(v){return{active:'生效',transition:'过渡期',future:'尚未生效',expired:'已过期',repealed:'废止',withdrawn:'撤回',superseded:'被替代',unknown:'待确认',draft:'草案',date_invalid:'日期异常'}[v]||v}
function chooseType(type){$('type').value=type;document.querySelectorAll('.metric').forEach(x=>x.classList.toggle('active',x.dataset.type===type));loadCatalog()}
function queryString(){return new URLSearchParams({q:$('q').value.trim(),type:$('type').value,region:$('region').value.trim(),product_class:$('productClass').value.trim(),lifecycle:$('lifecycle').value,evidence:$('evidence').value,as_of:$('asOf').value,limit:'800'}).toString()}
async function loadCatalog(){try{const d=await api('/api/catalog?'+queryString()),c=d.summary.type_counts||{};items=d.items||[];$('mAll').textContent=d.summary.total||0;$('mReg').textContent=c.regulation||0;$('mStd').textContent=c.standard||0;$('mCert').textContent=c.certification||0;$('mReq').textContent=c.requirement||0;$('mTest').textContent=c.test_item||0;$('resultCount').textContent=`符合条件 ${d.summary.filtered||0} 条 · 原始依据覆盖 ${(Number(d.summary.evidence_coverage||0)*100).toFixed(0)}%`;renderList();if(selectedId&&!items.some(x=>Number(x.id)===Number(selectedId))){selectedId=null;currentDetail=null;$('detailBox').innerHTML='<div class="empty">当前筛选条件下未包含之前选择的知识项。</div>'}}catch(e){$('catalogList').innerHTML='<div class="empty">加载失败：'+esc(e.message)+'</div>'}}
function renderList(){const box=$('catalogList');if(!items.length){box.innerHTML='<div class="empty">当前条件下暂无正式知识。</div>';return}box.innerHTML=items.map(x=>`<div class="item ${Number(selectedId)===Number(x.id)?'active':''}" onclick="showDetail(${Number(x.id)})"><div class="item-head"><div><span class="pill type ${esc(x.record_type)}">${esc(typeLabel(x.record_type))}</span><span class="pill ${esc(x.lifecycle_state)}">${esc(lifeLabel(x.lifecycle_state))}</span></div><span class="meta">${x.evidence_backed?'已有依据':'待补依据'}</span></div><h3>${esc(x.code||'')} ${esc(x.name)}</h3><div class="meta">${esc(x.region_name||x.region_code||'未标注地区')} · ${esc(x.product_class||'未标注产品分类')} · 版本 ${esc(x.version||'未标注')}</div><div class="meta">有效时间：${esc(x.effective_from||'未标注')} ～ ${esc(x.effective_to||'长期/未标注')} · 来源：${esc(x.source_filename||'未关联')}</div></div>`).join('')}
async function showDetail(id){selectedId=id;renderList();const box=$('detailBox');box.innerHTML='<div class="empty">正在加载详情…</div>';try{const [d,h]=await Promise.all([api(`/api/catalog/detail?id=${encodeURIComponent(id)}&as_of=${encodeURIComponent($('asOf').value)}`),api(`/api/catalog/history?id=${encodeURIComponent(id)}&limit=80`)]);currentDetail=d;currentHistory=h.items||[];renderDetail()}catch(e){box.innerHTML='<div class="empty">详情加载失败：'+esc(e.message)+'</div>'}}
function renderDetail(){const d=currentDetail||{},x=d.item||{};let html=`<div><span class="pill type ${esc(x.record_type)}">${esc(typeLabel(x.record_type))}</span><span class="pill ${esc(x.lifecycle_state)}">${esc(lifeLabel(x.lifecycle_state))}</span></div><h2 style="margin-top:9px">${esc(x.name||'未命名')}</h2><div class="code">${esc(x.code||'未标注编号')} · 版本 ${esc(x.version||'未标注')}</div><div class="actions"><button class="btn secondary" onclick="openEdit()">编辑内容</button><button class="btn" onclick="openVersion()">新增版本</button><button class="btn warn" onclick="openStatus()">状态维护</button><button class="btn secondary" onclick="openEvidence()">补充依据</button></div><div class="section"><div class="row"><b>国家/地区</b><span>${esc(x.region_name||x.region_code||'未标注')}</span></div><div class="row"><b>产品分类</b><span>${esc(x.product_class||'未标注')}</span></div><div class="row"><b>有效时间</b><span>${esc(x.effective_from||'未标注')} ～ ${esc(x.effective_to||'长期/未标注')}</span></div><div class="row"><b>主管机构</b><span>${esc(x.authority||'未标注')}</span></div><div class="row"><b>法律/业务效力</b><span>${esc(x.legal_effect||'未标注')}</span></div></div>`;
if(x.applicability_scope||x.exceptions||x.transition_note){html+=`<div class="section"><h3>适用范围与特殊条件</h3>${x.applicability_scope?`<div class="note"><b>适用范围</b>\n${esc(x.applicability_scope)}</div>`:''}${x.exceptions?`<div class="note" style="margin-top:7px"><b>例外条件</b>\n${esc(x.exceptions)}</div>`:''}${x.transition_note?`<div class="note" style="margin-top:7px"><b>过渡说明</b>\n${esc(x.transition_note)}</div>`:''}</div>`}
html+=`<div class="section"><h3>原始依据</h3><div class="row"><b>来源文件</b><span>${esc(x.source_filename||'未关联')}</span></div><div class="row"><b>文件位置</b><span>${x.source_chunk_index!=null?'第 '+esc(x.source_chunk_index)+' 个内容片段':'未标注'}</span></div>${x.source_url?`<div class="row"><b>来源地址</b><span>${esc(x.source_url)}</span></div>`:''}${x.review_basis?`<div class="row"><b>维护依据</b><span>${esc(x.review_basis)}</span></div>`:''}${d.evidence_excerpt?`<div class="note" style="margin-top:8px">${esc(d.evidence_excerpt)}</div>`:'<div class="note" style="margin-top:8px">当前知识项尚未关联可查看的原始内容片段。</div>'}</div>`;
html+=`<div class="section"><h3>版本沿革</h3>${(d.version_history||[]).map(v=>`<div class="version"><b>${esc(v.version||'未标版本')} · ${esc(lifeLabel(v.lifecycle_state))}</b><div class="meta">${esc(v.effective_from||'未标注')} ～ ${esc(v.effective_to||'长期/未标注')} ${Number(v.id)===Number(x.id)?'· 当前查看':''}</div></div>`).join('')||'<div class="meta">暂无其他版本。</div>'}</div>`;
html+=`<div class="section"><h3>已确认关联关系</h3>${(d.relations||[]).map(r=>`<div class="relation">${Number(r.source_record_id)===Number(x.id)?`<b>${esc(r.source_code||r.source_name)}</b> ${esc(r.relation_label)} <b>${esc(r.target_code||r.target_name)}</b>`:`<b>${esc(r.source_code||r.source_name)}</b> ${esc(r.relation_label)} <b>${esc(r.target_code||r.target_name)}</b>`}</div>`).join('')||'<div class="meta">暂无已确认关系。</div>'}<div class="actions"><a class="btn secondary" style="text-decoration:none" href="/graph">到知识图谱查看</a></div></div>`;
html+=`<div class="section"><h3>维护记录</h3>${renderHistory()}</div>`;$('detailBox').innerHTML=html}
function renderHistory(){if(!currentHistory.length)return'<div class="meta">当前还没有维护记录。</div>';return currentHistory.map(h=>{let summary='已保存本次维护';if(h.action==='status'){summary=`状态由 ${lifeLabel(h.before?.status||'unknown')} 调整为 ${lifeLabel(h.after?.status||'unknown')}`}else if(h.action==='create_version'){summary=`新增版本 ${h.after?.replacement?.version||''}，原版本 ${h.before?.version||''} 保留在版本沿革中`}else if(h.action==='attach_evidence'){summary='补充或调整了原始依据'}else if(h.action==='update'){summary='修改了正式知识内容'}return`<div class="audit"><b>${esc(h.action_label||h.action)}</b><div class="meta">${esc(summary)}</div><div class="meta">${esc(h.created_at||'')} · 维护人：${esc(h.operator||'未填写')}${h.note?' · '+esc(h.note):''}</div></div>`}).join('')}
function commonFooter(){return`<div class="field"><label>维护人</label><input id="fmOperator" value="${esc(localStorage.getItem('catalog_operator')||'')}"></div><div class="field wide"><label>维护说明</label><textarea id="fmNote" placeholder="建议填写修改原因、依据或业务说明"></textarea></div>`}
function openModal(title,mode,body){modalMode=mode;$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('modalMask').classList.add('show')}
function closeModal(){$('modalMask').classList.remove('show');modalMode=''}function maskClose(e){if(e.target===$('modalMask'))closeModal()}
function openEdit(){const x=currentDetail?.item||{};openModal('编辑正式知识','edit',`<div class="form-grid"><div class="field"><label>知识类别</label><select id="fmType"><option value="regulation">法规</option><option value="standard">标准</option><option value="certification">认证</option><option value="requirement">技术要求</option><option value="test_item">检测项目</option></select></div><div class="field"><label>当前状态</label><select id="fmStatus"><option value="unknown">待确认</option><option value="draft">草案</option><option value="active">生效</option><option value="transition">过渡期</option><option value="repealed">废止</option><option value="withdrawn">撤回</option><option value="superseded">被替代</option></select></div><div class="field wide"><label>名称</label><input id="fmName" value="${esc(x.name||'')}"></div><div class="field"><label>编号</label><input id="fmCode" value="${esc(x.code||'')}"></div><div class="field"><label>版本</label><input id="fmVersion" value="${esc(x.version||'')}"></div><div class="field"><label>地区代码</label><input id="fmRegionCode" value="${esc(x.region_code||'')}"></div><div class="field"><label>地区名称</label><input id="fmRegionName" value="${esc(x.region_name||'')}"></div><div class="field wide"><label>产品分类</label><input id="fmProductClass" value="${esc(x.product_class||'')}"></div><div class="field"><label>生效日期</label><input id="fmFrom" type="date" value="${esc(x.effective_from||'')}"></div><div class="field"><label>失效/截止日期</label><input id="fmTo" type="date" value="${esc(x.effective_to||'')}"></div><div class="field wide"><label>主管机构</label><input id="fmAuthority" value="${esc(x.authority||'')}"></div><div class="field wide"><label>适用范围</label><textarea id="fmScope">${esc(x.applicability_scope||'')}</textarea></div><div class="field wide"><label>例外条件</label><textarea id="fmExceptions">${esc(x.exceptions||'')}</textarea></div><div class="field wide"><label>过渡说明</label><textarea id="fmTransition">${esc(x.transition_note||'')}</textarea></div><div class="field wide"><label>法律/业务效力</label><textarea id="fmLegalEffect">${esc(x.legal_effect||'')}</textarea></div>${commonFooter()}</div>`);$('fmType').value=x.record_type||'requirement';$('fmStatus').value=x.status||'unknown'}
function openStatus(){const x=currentDetail?.item||{};openModal('状态维护','status',`<div class="form-grid"><div class="field"><label>调整后状态</label><select id="fmStatus"><option value="active">生效</option><option value="transition">过渡期</option><option value="repealed">废止</option><option value="withdrawn">撤回</option><option value="superseded">被替代</option><option value="unknown">待确认</option><option value="draft">草案</option></select></div><div class="field"><label>截止日期（可选）</label><input id="fmTo" type="date" value="${esc(x.effective_to||'')}"></div><div class="field wide"><div class="hint">正式知识不会被物理删除。废止、撤回或被替代后仍保留在台账、版本沿革和历史记录中。</div></div>${commonFooter()}</div>`);$('fmStatus').value=x.status||'active'}
function openVersion(){const x=currentDetail?.item||{};openModal('新增替代版本','version',`<div class="form-grid"><div class="field"><label>新版本</label><input id="fmVersion" placeholder="例如 2027 / V2"></div><div class="field"><label>新版本状态</label><select id="fmStatus"><option value="active">生效</option><option value="transition">过渡期</option><option value="draft">草案</option><option value="unknown">待确认</option></select></div><div class="field"><label>生效日期</label><input id="fmFrom" type="date"></div><div class="field"><label>截止日期（可选）</label><input id="fmTo" type="date"></div><div class="field wide"><label class="check"><input id="fmCopyEvidence" type="checkbox" checked>沿用当前版本的原始依据</label></div><div class="field wide"><label class="check"><input id="fmSupersede" type="checkbox" checked>将当前版本标记为“被替代”</label></div><div class="field wide"><label class="check"><input id="fmClosePrevious" type="checkbox">将当前版本截止日期自动设为新版本生效前一天</label></div><div class="field wide"><div class="hint">新增版本会创建一条新的正式知识记录；原版本不会覆盖。若勾选“被替代”，系统同时建立版本替代关系。</div></div>${commonFooter()}</div>`)}
async function openEvidence(){const x=currentDetail?.item||{};const opt=await api('/api/catalog/evidence-options');const docs=opt.documents||[];openModal('补充原始依据','evidence',`<div class="form-grid"><div class="field wide"><label>来源文件</label><select id="fmDocument" onchange="loadEvidenceChunks()"><option value="">请选择已接入资料</option>${docs.map(d=>`<option value="${Number(d.id)}">${esc(d.title||d.filename)} · ${esc(d.filename)}</option>`).join('')}</select></div><div class="field wide"><label>内容位置</label><select id="fmChunk"><option value="">选择文件后加载内容片段</option></select></div><div class="field wide"><label>来源地址（可选）</label><input id="fmSourceUrl" value="${esc(x.source_url||'')}" placeholder="可填写官方网站或资料来源地址"></div><div class="field wide"><label>维护依据</label><textarea id="fmReviewBasis">${esc(x.review_basis||'')}</textarea></div>${commonFooter()}</div>`);if(x.source_document_id){$('fmDocument').value=String(x.source_document_id);await loadEvidenceChunks(x.source_chunk_id)}}
async function loadEvidenceChunks(selected){const doc=Number($('fmDocument').value||0),sel=$('fmChunk');if(!doc){sel.innerHTML='<option value="">请选择来源文件</option>';return}try{const d=await api('/api/catalog/evidence-options?document_id='+doc);sel.innerHTML=(d.chunks||[]).map(c=>`<option value="${Number(c.id)}">片段 ${c.chunk_index} · ${esc(c.preview||'').slice(0,90)}</option>`).join('')||'<option value="">该文件没有可选内容片段</option>';if(selected)sel.value=String(selected)}catch(e){sel.innerHTML='<option value="">加载失败</option>'}}
async function saveModal(){if(!selectedId)return;const save=$('modalSave');save.disabled=true;try{const operator=$('fmOperator')?.value.trim()||'',note=$('fmNote')?.value.trim()||'';if(operator)localStorage.setItem('catalog_operator',operator);let result;if(modalMode==='edit'){result=await post('/api/catalog/update',{record_id:selectedId,operator,note,changes:{record_type:$('fmType').value,status:$('fmStatus').value,name:$('fmName').value,code:$('fmCode').value,version:$('fmVersion').value,region_code:$('fmRegionCode').value,region_name:$('fmRegionName').value,product_class:$('fmProductClass').value,effective_from:$('fmFrom').value,effective_to:$('fmTo').value,authority:$('fmAuthority').value,applicability_scope:$('fmScope').value,exceptions:$('fmExceptions').value,transition_note:$('fmTransition').value,legal_effect:$('fmLegalEffect').value}})}else if(modalMode==='status'){result=await post('/api/catalog/status',{record_id:selectedId,status:$('fmStatus').value,effective_to:$('fmTo').value,operator,note})}else if(modalMode==='version'){result=await post('/api/catalog/version',{record_id:selectedId,version:$('fmVersion').value,effective_from:$('fmFrom').value,effective_to:$('fmTo').value,status:$('fmStatus').value,copy_evidence:$('fmCopyEvidence').checked,mark_source_superseded:$('fmSupersede').checked,close_source_day_before:$('fmClosePrevious').checked,operator,note})}else if(modalMode==='evidence'){result=await post('/api/catalog/evidence',{record_id:selectedId,document_id:Number($('fmDocument').value||0)||null,chunk_id:Number($('fmChunk').value||0)||null,source_url:$('fmSourceUrl').value,review_basis:$('fmReviewBasis').value,operator,note})}else return;const nextId=result.replacement_record_id||selectedId;closeModal();await loadCatalog();await showDetail(nextId)}catch(e){alert('保存失败：'+e.message)}finally{save.disabled=false}}
loadCatalog();
</script>
</body>
</html>
