<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>变化待办 · 法规认证知识平台</title>
<style>
:root{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;color:#17243a;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}.top{height:64px;background:#0a2e5e;color:#fff;display:flex;justify-content:space-between;align-items:center;padding:0 28px}.brand{font-size:19px;font-weight:700}.top a{color:#dceafb;text-decoration:none;font-size:12px;margin-left:13px}.wrap{max-width:1480px;margin:18px auto;padding:0 20px}.hero{background:linear-gradient(125deg,#103d78,#0d608b);color:#fff;border-radius:16px;padding:24px 27px;margin-bottom:14px}.hero h1{font-size:25px;margin:0 0 7px}.hero p{margin:0;color:#dceafb;line-height:1.7;max-width:980px}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px}.metric,.card{background:#fff;border:1px solid #e1e7ef;border-radius:12px;box-shadow:0 4px 14px #19304b0a}.metric{padding:13px 15px}.metric span{font-size:11px;color:#7c8999}.metric strong{display:block;font-size:22px;color:#123d6c;margin-top:3px}.card{padding:16px}.filters{display:grid;grid-template-columns:160px 220px 150px auto auto;gap:9px;align-items:end}.filters label{display:block;font-size:11px;color:#718095;margin-bottom:5px}select,input,textarea{width:100%;border:1px solid #cad4e1;border-radius:8px;padding:9px 10px;background:#fff;font:inherit}textarea{min-height:78px;resize:vertical}.btn{border:0;border-radius:8px;background:#0d4f91;color:#fff;padding:9px 14px;cursor:pointer;white-space:nowrap}.btn.secondary{background:#eef4fb;color:#0d4f91}.btn.good{background:#2f7b59}.btn.light{background:#f1f4f7;color:#566679}.layout{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(380px,.85fr);gap:14px;margin-top:14px}.list{display:flex;flex-direction:column;gap:8px;max-height:720px;overflow:auto}.item{border:1px solid #dfe6ef;border-radius:10px;padding:11px;background:#fff;cursor:pointer}.item:hover,.item.active{border-color:#76a1ca;background:#f8fbff}.item-head{display:flex;justify-content:space-between;gap:10px}.item h3{font-size:14px;margin:7px 0 4px}.meta{font-size:11px;color:#7c8999;line-height:1.6}.pill{display:inline-block;border-radius:999px;padding:3px 7px;font-size:10px;margin-right:5px;background:#edf2f7;color:#5d6e82}.pill.high{background:#fdecec;color:#a13f3f}.pill.medium{background:#fff2dc;color:#946313}.pill.low{background:#eef3f7;color:#607286}.pill.open{background:#fff2dc;color:#946313}.pill.resolved{background:#eaf8f0;color:#2f7651}.pill.dismissed{background:#eef1f4;color:#6c7887}.detail h2{font-size:18px;margin:8px 0 4px}.section{border-top:1px solid #e7ecf2;margin-top:14px;padding-top:13px}.section h3{font-size:13px;margin:0 0 8px}.row{display:grid;grid-template-columns:125px 1fr;gap:8px;font-size:12px;line-height:1.65;margin-top:5px}.row b{color:#68778b}.note{background:#f6f9fc;border-radius:8px;padding:10px;font-size:12px;color:#5e6e82;line-height:1.65;white-space:pre-wrap}.compare{display:grid;grid-template-columns:1fr 1fr;gap:9px}.compare>div{background:#f8fafc;border:1px solid #e5ebf1;border-radius:9px;padding:10px}.compare h4{margin:0 0 7px;font-size:12px;color:#4e6075}.diff{border-left:3px solid #db9d43;background:#fff9ee;border-radius:0 8px 8px 0;padding:8px 10px;margin:7px 0;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.empty{font-size:13px;color:#7c8999;padding:28px;text-align:center}.headbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.headbar h2{font-size:16px;margin:0}.count{font-size:12px;color:#718095}@media(max-width:1100px){.layout{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(3,1fr)}.filters{grid-template-columns:1fr 1fr}.compare{grid-template-columns:1fr}}@media(max-width:650px){.top{padding:0 14px}.wrap{padding:0 12px}.metrics,.filters{grid-template-columns:1fr 1fr}.hero h1{font-size:21px}.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="top"><div class="brand">变化待办</div><div><a href="/">工作台</a><a href="/catalog">正式知识目录</a><a href="/admin">资料及模型配置</a></div></div>
<div class="wrap">
  <div class="hero"><h1>发现变化，形成待办，人工确认后再更新正式知识</h1><p>新资料解析后，系统自动与现有正式知识比对，识别可能的版本变化、效力状态变化、认证要求变化和新增要求；正式知识发生维护时，也会提示复核相关认证、要求和准入影响。</p></div>
  <div class="metrics"><div class="metric"><span>待处理</span><strong id="mOpen">-</strong></div><div class="metric"><span>重要待办</span><strong id="mHigh">-</strong></div><div class="metric"><span>一般待办</span><strong id="mMedium">-</strong></div><div class="metric"><span>已核对</span><strong id="mResolved">-</strong></div><div class="metric"><span>无需处理</span><strong id="mDismissed">-</strong></div></div>
  <div class="card"><div class="filters"><div><label>处理状态</label><select id="status"><option value="open">待处理</option><option value="resolved">已核对</option><option value="dismissed">无需处理</option><option value="">全部</option></select></div><div><label>变化类型</label><select id="type"><option value="">全部类型</option><option value="version_difference">版本差异</option><option value="status_difference">效力状态变化</option><option value="effective_date_difference">生效时间变化</option><option value="content_change">法规标准内容变化</option><option value="requirement_change">认证/要求变化</option><option value="possible_new_requirement">可能新增认证要求</option><option value="possible_new_rule">可能新增法规标准</option><option value="impact_review">关联影响复核</option></select></div><div><label>重要程度</label><select id="severity"><option value="">全部</option><option value="high">重要</option><option value="medium">一般</option><option value="low">提示</option></select></div><button class="btn" onclick="loadTasks()">查询待办</button><button class="btn secondary" onclick="scanAll()">重新检查待校核内容</button></div></div>
  <div class="layout"><div class="card"><div class="headbar"><h2>变化待办</h2><span id="count" class="count">正在加载…</span></div><div id="list" class="list"></div></div><div class="card detail"><div id="detail" class="empty">选择左侧待办查看新资料与现有正式知识的差异。</div></div></div>
</div>
<script>
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let items=[],selected=null;
async function api(url,opt){const r=await fetch(url,opt);let d={};try{d=await r.json()}catch(e){throw new Error('服务返回格式异常')}if(!r.ok||d.error)throw new Error(d.error||`HTTP ${r.status}`);return d}
const eventLabel={version_difference:'版本差异',status_difference:'效力状态变化',effective_date_difference:'生效时间变化',content_change:'法规标准内容变化',requirement_change:'认证/要求变化',possible_new_requirement:'可能新增认证要求',possible_new_rule:'可能新增法规标准',impact_review:'关联影响复核'};const severityLabel={high:'重要',medium:'一般',low:'提示'};const statusLabel={open:'待处理',resolved:'已核对',dismissed:'无需处理'};
async function refreshSummary(){try{const s=await api('/api/change-watch/summary');$('mOpen').textContent=s.open||0;$('mHigh').textContent=s.open_high||0;$('mMedium').textContent=s.open_medium||0;$('mResolved').textContent=s.resolved||0;$('mDismissed').textContent=s.dismissed||0}catch(e){}}
async function loadTasks(){try{const q=new URLSearchParams({status:$('status').value,type:$('type').value,severity:$('severity').value,limit:'400'});const d=await api('/api/change-watch/tasks?'+q);items=d.items||[];$('count').textContent=`${items.length} 项`;renderList();if(selected&&!items.some(x=>Number(x.id)===Number(selected))){selected=null;$('detail').innerHTML='<div class="empty">当前筛选条件下不包含之前选择的待办。</div>'}}catch(e){$('list').innerHTML='<div class="empty">加载失败：'+esc(e.message)+'</div>'}}
function renderList(){if(!items.length){$('list').innerHTML='<div class="empty">当前没有符合条件的变化待办。</div>';return}$('list').innerHTML=items.map(x=>`<div class="item ${Number(selected)===Number(x.id)?'active':''}" onclick="showDetail(${Number(x.id)})"><div class="item-head"><div><span class="pill ${esc(x.severity)}">${esc(severityLabel[x.severity]||x.severity)}</span><span class="pill ${esc(x.status)}">${esc(statusLabel[x.status]||x.status)}</span></div><span class="meta">${esc(x.created_at||'')}</span></div><h3>${esc(x.title)}</h3><div class="meta">${esc(eventLabel[x.event_type]||x.event_label||x.event_type)} · ${esc(x.region_code||'未标注地区')} · ${esc(x.product_class||'未标注产品分类')}</div><div class="meta">${esc(x.source_filename||'来自正式知识维护')}</div></div>`).join('')}
function value(obj,key){if(!obj)return'未标注';const attrs=obj.attributes||{};return obj[key]||attrs[key]||'未标注'}
async function showDetail(id){selected=id;renderList();$('detail').innerHTML='<div class="empty">正在加载…</div>';try{const d=await api('/api/change-watch/detail?id='+encodeURIComponent(id)),t=d.task||{},c=d.candidate?.candidate_payload||d.task?.payload?.candidate||null,e=d.existing||null,diff=t.payload?.difference||{};let html=`<div><span class="pill ${esc(t.severity)}">${esc(severityLabel[t.severity]||t.severity)}</span><span class="pill ${esc(t.status)}">${esc(statusLabel[t.status]||t.status)}</span></div><h2>${esc(t.title)}</h2><div class="meta">${esc(eventLabel[t.event_type]||t.event_label||t.event_type)} · ${esc(t.created_at||'')}</div><div class="section"><h3>需要核对什么</h3><div class="note">${esc(t.summary||'')}</div></div>`;
if(e||c){html+=`<div class="section"><h3>现有正式知识与新资料识别内容</h3><div class="compare"><div><h4>现有正式知识</h4><div class="row"><b>名称</b><span>${esc(value(e,'name'))}</span></div><div class="row"><b>编号</b><span>${esc(value(e,'code'))}</span></div><div class="row"><b>版本</b><span>${esc(value(e,'version'))}</span></div><div class="row"><b>状态</b><span>${esc(value(e,'status'))}</span></div><div class="row"><b>生效时间</b><span>${esc(value(e,'effective_from'))}</span></div></div><div><h4>新资料识别内容</h4><div class="row"><b>名称</b><span>${esc(value(c,'name'))}</span></div><div class="row"><b>编号</b><span>${esc(value(c,'code'))}</span></div><div class="row"><b>版本</b><span>${esc(value(c,'version'))}</span></div><div class="row"><b>状态</b><span>${esc(value(c,'status'))}</span></div><div class="row"><b>生效时间</b><span>${esc(value(c,'effective_from'))}</span></div></div></div></div>`}
const diffEntries=Object.entries(diff);if(diffEntries.length){html+=`<div class="section"><h3>识别到的差异</h3>${diffEntries.map(([k,v])=>`<div class="diff"><b>${esc(k)}</b><br>${esc(typeof v==='object'?JSON.stringify(v):v)}</div>`).join('')}</div>`}
if(d.evidence_excerpt){html+=`<div class="section"><h3>新资料依据片段</h3><div class="note">${esc(d.evidence_excerpt)}</div></div>`}
if(t.event_type==='impact_review'){html+=`<div class="section"><h3>关联影响提示</h3><div class="note">当前正式知识已发生维护。建议到知识图谱核对下游认证、技术要求、检测项目及产品准入结果是否需要同步复核。</div></div>`}
if(t.status==='open'){html+=`<div class="section"><h3>处理记录</h3><input id="operator" placeholder="维护人（可选）"><textarea id="note" placeholder="核对说明（可选）"></textarea><div class="actions"><button class="btn good" onclick="reviewTask(${Number(t.id)},'resolve')">已核对</button><button class="btn light" onclick="reviewTask(${Number(t.id)},'dismiss')">无需处理</button>${t.candidate_task_id?'<a class="btn secondary" href="/admin" style="text-decoration:none">进入知识治理</a>':''}${t.existing_record_id?'<a class="btn secondary" href="/catalog" style="text-decoration:none">查看正式知识</a>':''}<a class="btn secondary" href="/graph" style="text-decoration:none">查看知识图谱</a></div></div>`}else{html+=`<div class="section"><h3>处理结果</h3><div class="row"><b>维护人</b><span>${esc(t.operator||'未填写')}</span></div><div class="row"><b>处理说明</b><span>${esc(t.resolution_note||'未填写')}</span></div><div class="row"><b>处理时间</b><span>${esc(t.resolved_at||'')}</span></div></div>`}$('detail').innerHTML=html}catch(e){$('detail').innerHTML='<div class="empty">详情加载失败：'+esc(e.message)+'</div>'}}
async function reviewTask(id,action){try{await api('/api/change-watch/review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({task_id:id,action,operator:$('operator')?.value||'',note:$('note')?.value||''})});selected=null;await Promise.all([refreshSummary(),loadTasks()]);$('detail').innerHTML='<div class="empty">处理完成，可继续选择其他待办。</div>'}catch(e){alert('处理失败：'+e.message)}}
async function scanAll(){try{const d=await api('/api/change-watch/scan',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});alert(`检查完成：扫描 ${d.scanned_candidates||0} 条待校核内容，新形成 ${d.created||0} 项变化待办。`);await Promise.all([refreshSummary(),loadTasks()])}catch(e){alert('检查失败：'+e.message)}}
refreshSummary();loadTasks();
</script>
</body>
</html>
