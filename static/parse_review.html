<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>文档解析复核 · 法规认证知识平台</title>
<style>
:root{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;color:#17243a;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}.top{height:64px;background:#0a2e5e;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 26px}.top a{color:#dce8f5;text-decoration:none;font-size:13px}.brand{font-weight:700;font-size:19px}.wrap{max-width:1600px;margin:18px auto;padding:0 20px}.hero,.card,.metric{background:#fff;border:1px solid #e1e7ef;border-radius:12px}.hero{padding:20px 24px}.hero h1{margin:0 0 8px;color:#113f72;font-size:25px}.hero p{margin:0;color:#69798d;line-height:1.65}.toolbar{display:grid;grid-template-columns:1.4fr auto auto;gap:9px;margin-top:14px}.toolbar select,.toolbar button{padding:10px;border-radius:8px;border:1px solid #cbd5e1;background:#fff}.toolbar button{border:0;background:#0d4f91;color:#fff;cursor:pointer}.metrics{display:grid;grid-template-columns:repeat(8,1fr);gap:9px;margin:14px 0}.metric{padding:12px}.metric span{display:block;font-size:11px;color:#8190a3}.metric b{display:block;font-size:21px;color:#133e6d;margin-top:4px}.layout{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{padding:14px}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}.panel-head h2{font-size:16px;margin:0}.page-control{display:flex;gap:8px;align-items:center}.page-control button{border:0;border-radius:7px;padding:7px 10px;background:#edf3f8;color:#274d73;cursor:pointer}.viewer{min-height:650px;background:#e7ecf2;border-radius:8px;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:10px}.viewer img{max-width:100%;height:auto;box-shadow:0 2px 10px #aeb8c5}.diag{font-size:12px;color:#64758a;line-height:1.6;margin-bottom:9px}.badges{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}.badge{font-size:10px;padding:3px 7px;border-radius:999px;background:#edf3f8}.badge.high{background:#e7f6ed;color:#2c704c}.badge.medium{background:#fff2d8;color:#895f16}.badge.low{background:#fbe8e8;color:#923d3d}.blocks{max-height:650px;overflow:auto}.block{border:1px solid #e2e8ef;border-radius:8px;padding:10px;margin:8px 0;background:#fbfcfe}.block.heading{border-left:4px solid #316da8}.block.table{border-left:4px solid #4f9274}.block .type{font-size:10px;color:#718096;margin-bottom:5px}.block pre{white-space:pre-wrap;font-family:inherit;font-size:12px;line-height:1.55;margin:0}.table-data{overflow:auto}.table-data table{border-collapse:collapse;font-size:11px}.table-data td{border:1px solid #dfe5ec;padding:5px 7px;min-width:70px}.pages{margin-top:14px}.page-table{width:100%;border-collapse:collapse;font-size:12px}.page-table th,.page-table td{padding:8px;border-bottom:1px solid #e5ebf1;text-align:left}.page-table tr{cursor:pointer}.page-table tr:hover{background:#f7fafc}.muted{color:#7b8797;font-size:12px}@media(max-width:1100px){.metrics{grid-template-columns:repeat(4,1fr)}.layout{grid-template-columns:1fr}}@media(max-width:650px){.metrics{grid-template-columns:1fr 1fr}.toolbar{grid-template-columns:1fr}.top{padding:0 14px}}
</style>
</head>
<body>
<div class="top"><div class="brand">文档解析复核</div><div><a href="/admin" style="margin-right:14px">资料及模型配置</a><a href="/">工作台</a></div></div>
<div class="wrap">
<div class="hero"><h1>原始页面与解析结果对照</h1><p>按页查看法规文件的页面类型、解析策略、质量评分、标题/条款层级、表格结构和异常页。用于POC现场复核解析质量，不把字段抽取结果与文档解析质量混为一项。</p></div>
<div class="toolbar"><select id="docSelect"></select><button onclick="loadReport()">加载解析结果</button><button onclick="showIssuePage()">跳到异常页</button></div>
<div class="metrics">
<div class="metric"><span>页数</span><b id="mPages">-</b></div><div class="metric"><span>平均质量</span><b id="mQuality">-</b></div><div class="metric"><span>高质量页</span><b id="mHigh">-</b></div><div class="metric"><span>中质量页</span><b id="mMedium">-</b></div><div class="metric"><span>低质量页</span><b id="mLow">-</b></div><div class="metric"><span>表格页</span><b id="mTables">-</b></div><div class="metric"><span>OCR页</span><b id="mOcr">-</b></div><div class="metric"><span>异常页</span><b id="mIssues">-</b></div>
</div>
<div class="layout">
<div class="card"><div class="panel-head"><h2>原始 PDF 页面</h2><div class="page-control"><button onclick="step(-1)">上一页</button><span id="pageLabel">-</span><button onclick="step(1)">下一页</button></div></div><div class="viewer"><img id="pageImage" alt="PDF页面"></div></div>
<div class="card"><div class="panel-head"><h2>解析结果</h2><div class="muted" id="strategy"></div></div><div id="diag" class="diag"></div><div id="badges" class="badges"></div><div id="blocks" class="blocks"></div></div>
</div>
<div class="card pages"><div class="panel-head"><h2>逐页质量明细</h2><div class="muted">点击任意一页进行原文对照</div></div><div style="overflow:auto"><table class="page-table"><thead><tr><th>页</th><th>页面类型</th><th>策略</th><th>质量</th><th>文字</th><th>表格</th><th>标题</th><th>异常</th></tr></thead><tbody id="pageRows"></tbody></table></div></div>
</div>
<script>
const $=id=>document.getElementById(id);let report=null,currentPage=1;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const typeLabel=v=>({native_text:'原生文本',scan:'扫描页',table_rich:'表格页',mixed:'混合页',complex_layout:'复杂版式',sparse_text:'稀疏文本'}[v]||v);
const issueLabel=v=>({scanned_page:'扫描页',table_detected:'检测到表格',complex_layout:'复杂版式',text_layer_noise:'文字层噪声',fragmented_lines:'断行较多',sparse_text:'文字较少',ocr_required:'需要OCR',ocr_failed:'OCR失败'}[v]||v);
async function api(u){const r=await fetch(u);const d=await r.json();if(!r.ok||d.error)throw new Error(d.error||'请求失败');return d}
async function loadDocs(){const d=await api('/api/documents');const pdfs=(d.items||[]).filter(x=>x.mime_type==='application/pdf');$('docSelect').innerHTML=pdfs.length?pdfs.map(x=>'<option value="'+x.id+'">'+esc(x.filename)+' · '+esc(x.parser||'')+'</option>').join(''):'<option value="">暂无已解析PDF</option>';if(pdfs.length)loadReport()}
async function loadReport(){const id=$('docSelect').value;if(!id)return;report=await api('/api/parser/report?document_id='+id);const s=report.summary||{};$('mPages').textContent=s.page_count||0;$('mQuality').textContent=(s.average_quality??'-');$('mHigh').textContent=s.high_quality_pages||0;$('mMedium').textContent=s.medium_quality_pages||0;$('mLow').textContent=s.low_quality_pages||0;$('mTables').textContent=s.table_pages||0;$('mOcr').textContent=s.ocr_pages||0;$('mIssues').textContent=(s.issue_pages||[]).length;renderRows();showPage(1)}
function renderRows(){$('pageRows').innerHTML=(report?.pages||[]).map(p=>'<tr onclick="showPage('+p.page_no+')"><td>'+p.page_no+'</td><td>'+esc(typeLabel(p.page_type))+'</td><td>'+esc(p.strategy)+'</td><td>'+p.quality_score+'</td><td>'+p.text_chars+'</td><td>'+p.table_count+'</td><td>'+p.heading_count+'</td><td>'+esc((p.issues||[]).map(issueLabel).join('、')||'无')+'</td></tr>').join('')}
function showPage(n){const pages=report?.pages||[];if(!pages.length)return;currentPage=Math.max(1,Math.min(n,pages.length));const p=pages[currentPage-1];$('pageLabel').textContent='第 '+currentPage+' / '+pages.length+' 页';$('pageImage').src='/api/parser/page-image?document_id='+report.document.id+'&page='+currentPage+'&scale=1.35&ts='+Date.now();$('strategy').textContent=typeLabel(p.page_type)+' · '+p.strategy;$('diag').textContent='质量 '+p.quality_score+' · 文字 '+p.text_chars+' 字符 · '+p.word_count+' 词 · 图片 '+p.image_count+' · 表格 '+p.table_count+' · 结构块 '+p.block_count;$('badges').innerHTML='<span class="badge '+esc(p.quality_band)+'">'+esc(p.quality_band)+'</span>'+(p.issues||[]).map(x=>'<span class="badge">'+esc(issueLabel(x))+'</span>').join('');$('blocks').innerHTML=(p.blocks||[]).map(b=>renderBlock(b)).join('')||'<div class="muted">当前页没有可展示的解析块。</div>'}
function renderBlock(b){let body='<pre>'+esc(b.text||'')+'</pre>';if(b.type==='table'&&b.rows?.length)body='<div class="table-data"><table>'+b.rows.map(r=>'<tr>'+r.map(c=>'<td>'+esc(c)+'</td>').join('')+'</tr>').join('')+'</table></div>';const hierarchy=(b.hierarchy||[]).join(' → ');return '<div class="block '+esc(b.type)+'"><div class="type">'+esc(b.type)+(hierarchy?' · '+esc(hierarchy):'')+'</div>'+body+'</div>'}
function step(d){showPage(currentPage+d)}function showIssuePage(){const arr=report?.summary?.issue_pages||[];if(arr.length)showPage(arr.find(x=>x>currentPage)||arr[0])}
loadDocs().catch(e=>{$('docSelect').innerHTML='<option>'+esc(e.message)+'</option>'});
</script>
</body></html>
