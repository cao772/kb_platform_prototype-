<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>知识图谱 · 法规认证知识平台</title>
<style>
:root{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;color:#17243a;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}.top{height:64px;background:#0a2e5e;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 28px}.top b{font-size:19px}.top a{color:#e7f1fb;text-decoration:none;border:1px solid #6f8daf;border-radius:8px;padding:7px 11px;font-size:12px}.wrap{max-width:1500px;margin:18px auto;padding:0 20px}.hero{background:linear-gradient(125deg,#103d78,#0d608b);color:#fff;border-radius:16px;padding:24px 27px;margin-bottom:14px}.hero h1{margin:0 0 7px;font-size:25px}.hero p{margin:0;color:#dceafb;line-height:1.7}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.metric,.card{background:#fff;border:1px solid #e1e7ef;border-radius:12px;box-shadow:0 4px 14px #19304b0a}.metric{padding:13px 15px}.metric span{font-size:12px;color:#7d8999}.metric strong{display:block;font-size:23px;color:#123d6c}.card{padding:16px}.filters{display:grid;grid-template-columns:180px 1fr 180px auto auto;gap:8px;align-items:end}.grid{display:grid;grid-template-columns:1.45fr .55fr;gap:14px}.bottom{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}label{font-size:11px;color:#6e7d91;display:block;margin-bottom:5px}input,select,textarea{width:100%;border:1px solid #cad4e1;border-radius:8px;padding:9px 10px;background:#fff;font:inherit}.btn{border:0;border-radius:8px;background:#0d4f91;color:#fff;padding:9px 13px;cursor:pointer;white-space:nowrap}.btn.secondary{background:#eef4fb;color:#0d4f91}.btn.reject{background:#fbecec;color:#a13b3b}.note{font-size:12px;color:#607087;line-height:1.65;background:#f5f8fc;border-radius:8px;padding:9px 11px}.diagram{border:1px solid #d9e3ee;border-radius:12px;background:#fbfdff;overflow:auto;min-height:610px}.diagram svg{display:block;min-width:1120px}.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:#65748a;margin-top:8px}.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:4px}.detail{background:#f8fafc;border:1px solid #e1e8f0;border-radius:10px;padding:12px;font-size:12px;line-height:1.75;min-height:170px}.detail h3{font-size:15px;margin:0 0 7px}.relations{display:flex;flex-direction:column;gap:8px;max-height:510px;overflow:auto}.rel{border:1px solid #dfe6ef;border-radius:9px;padding:9px;background:#fff}.rel b{font-size:12px}.rel p{font-size:12px;color:#5d697b;margin:5px 0}.meta{font-size:11px;color:#8793a3}.actions{display:flex;gap:6px;margin-top:7px}.actions .btn{font-size:11px;padding:6px 9px}.path{border-left:3px solid #6f9ccb;background:#f8fafc;padding:9px 10px;margin:7px 0;border-radius:0 8px 8px 0;font-size:12px;line-height:1.6}.pill{display:inline-block;border-radius:999px;padding:3px 7px;font-size:10px;background:#edf3f8;color:#52657a;margin-right:5px}.pill.ok{background:#eaf8f0;color:#2c7551}.pill.warn{background:#fff3df;color:#956313}.impact{border-left:3px solid #c48845;background:#fffaf4;padding:8px 10px;margin-top:7px;border-radius:0 8px 8px 0;font-size:12px}.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:11px}.section-title h2{font-size:16px;margin:0}.empty{color:#7d8999;font-size:12px;padding:24px;text-align:center}@media(max-width:1000px){.grid,.bottom{grid-template-columns:1fr}.metrics{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr 1fr}.top{padding:0 14px}}@media(max-width:620px){.metrics,.filters{grid-template-columns:1fr}.wrap{padding:0 12px}}
</style>
</head>
<body>
<div class="top"><b>知识图谱</b><a href="/">← 返回工作台</a></div>
<div class="wrap">
  <div class="hero"><h1>从法规看到认证路径，从变化看到影响范围</h1><p>查看一项法规如何关联标准、认证、技术要求和检测项目；当法规或标准发生变化时，可沿已确认关系追踪可能受影响的下游要求。</p></div>
  <div class="metrics"><div class="metric"><span>已确认关系</span><strong id="mApproved">-</strong></div><div class="metric"><span>待确认关系</span><strong id="mPending">-</strong></div><div class="metric"><span>当前知识项</span><strong id="mNodes">-</strong></div><div class="metric"><span>当前关联关系</span><strong id="mEdges">-</strong></div></div>

  <div class="card"><div class="filters"><div><label>国家/地区</label><select id="region"><optgroup label="欧洲"><option value="DE">德国 DE</option><option value="FR">法国 FR</option><option value="IT">意大利 IT</option><option value="ES">西班牙 ES</option><option value="NL">荷兰 NL</option><option value="BE">比利时 BE</option><option value="SE">瑞典 SE</option><option value="DK">丹麦 DK</option><option value="FI">芬兰 FI</option><option value="AT">奥地利 AT</option><option value="IE">爱尔兰 IE</option><option value="NO">挪威 NO</option><option value="CH">瑞士 CH</option><option value="GB">英国 GB</option></optgroup><optgroup label="北美"><option value="US">美国 US</option><option value="CA">加拿大 CA</option></optgroup><optgroup label="亚太"><option value="JP">日本 JP</option><option value="KR">韩国 KR</option><option value="AU">澳大利亚 AU</option><option value="NZ">新西兰 NZ</option><option value="SG">新加坡 SG</option></optgroup><optgroup label="共享范围"><option value="EU">欧盟共享范围 EU</option></optgroup></select></div><div><label>产品分类</label><input id="productClass" value="家用电器"></div><div><label>判断日期</label><input id="asOf" type="date"></div><button class="btn" onclick="loadGraph()">查看关系</button><button class="btn secondary" onclick="suggestRelations()">识别关联关系</button></div><div class="note" style="margin-top:10px">新识别出的关联关系需要人工确认后，才会进入正式关系图、认证路径和变化影响分析。</div></div>

  <div class="grid" style="margin-top:14px">
    <div class="card"><div class="section-title"><h2>法规认证关系图</h2><span class="meta">点击知识项查看详情</span></div><div class="diagram"><svg id="graphSvg" width="1180" height="610" viewBox="0 0 1180 610"></svg></div><div class="legend"><span><i class="dot" style="background:#386fa4"></i>法规</span><span><i class="dot" style="background:#4b8f70"></i>标准</span><span><i class="dot" style="background:#c47b32"></i>认证</span><span><i class="dot" style="background:#8b63a8"></i>技术要求</span><span><i class="dot" style="background:#aa5c67"></i>检测项目</span></div></div>
    <div class="card"><h2 style="font-size:16px;margin:0 0 12px">知识项详情</h2><div id="nodeDetail" class="detail"><div class="empty">点击左侧知识项查看编号、版本、适用地区、产品分类和依据情况。</div></div><button id="impactBtn" class="btn secondary" style="margin-top:10px;display:none" onclick="runImpact()">查看变化影响</button><div id="impactResult"></div></div>
  </div>

  <div class="bottom">
    <div class="card"><div class="section-title"><h2>认证与合规路径</h2><button class="btn" onclick="loadPaths()">生成路径</button></div><div id="pathResult" class="detail"><div class="empty">生成后展示法规、标准、认证、技术要求和检测项目之间的完整路径。</div></div></div>
    <div class="card"><div class="section-title"><h2>关联关系校核</h2><div style="display:flex;gap:7px"><select id="relationStatus" onchange="loadRelations()"><option value="pending">待确认</option><option value="approved">已确认</option><option value="rejected">已驳回</option><option value="">全部</option></select><button class="btn secondary" onclick="loadRelations()">刷新</button></div></div><div id="relationList" class="relations"></div></div>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let selectedRecordId=null,currentGraph={nodes:[],edges:[]};$('asOf').value=new Date().toISOString().slice(0,10);
async function api(url,opt){const r=await fetch(url,opt);let d={};try{d=await r.json()}catch(e){throw new Error('服务返回格式异常')}if(!r.ok||d.error)throw new Error(d.error||r.statusText);return d}
function params(){return{region_code:$('region').value,product_class:$('productClass').value.trim(),as_of:$('asOf').value||null}}
function typeLabel(v){return{regulation:'法规',standard:'标准',certification:'认证',requirement:'技术要求',test_item:'检测项目'}[v]||v}function lifeLabel(v){return{active:'生效',transition:'过渡期',future:'尚未生效',expired:'已过期',repealed:'废止',withdrawn:'撤回',superseded:'被替代',unknown:'待确认'}[v]||v}function statusLabel(v){return{pending:'待确认',approved:'已确认',rejected:'已驳回'}[v]||v}
async function refreshSummary(){try{const s=await api('/api/graph/summary');$('mApproved').textContent=s.approved||0;$('mPending').textContent=s.pending||0}catch(e){}}
async function suggestRelations(){try{const d=await api('/api/graph/suggest',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(params())});alert(`已识别 ${d.created||0} 条新的待确认关系`);await Promise.all([refreshSummary(),loadRelations()])}catch(e){alert('识别失败：'+e.message)}}
async function loadRelations(){try{const d=await api('/api/graph/relations?status='+encodeURIComponent($('relationStatus').value));const box=$('relationList');if(!(d.items||[]).length){box.innerHTML='<div class="empty">当前没有关系记录。</div>';return}box.innerHTML='';(d.items||[]).forEach(x=>{const div=document.createElement('div');div.className='rel';div.innerHTML=`<b>${esc(x.source_name||x.source_code||'知识项')} → ${esc(x.relation_label||x.relation_type||'关联')} → ${esc(x.target_name||x.target_code||'知识项')}</b><p>${esc(typeLabel(x.source_type))} 与 ${esc(typeLabel(x.target_type))} 的业务关联</p><div class="meta">状态：${esc(statusLabel(x.status))}${x.confidence!=null?` · 参考匹配度 ${(Number(x.confidence)*100).toFixed(0)}%`:''}</div>`;if(x.status==='pending'){const a=document.createElement('div');a.className='actions';a.innerHTML='<button class="btn">确认关系</button><button class="btn reject">驳回</button>';a.children[0].onclick=()=>reviewRelation(x.id,'approve');a.children[1].onclick=()=>reviewRelation(x.id,'reject');div.appendChild(a)}box.appendChild(div)})}catch(e){$('relationList').innerHTML='<div class="empty">关系加载失败：'+esc(e.message)+'</div>'}}
async function reviewRelation(id,action){try{await api('/api/graph/review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({relation_id:id,action})});await Promise.all([loadRelations(),refreshSummary(),loadGraph()])}catch(e){alert('处理失败：'+e.message)}}
function nodeColor(type){return{regulation:'#386fa4',standard:'#4b8f70',certification:'#c47b32',requirement:'#8b63a8',test_item:'#aa5c67'}[type]||'#66788a'}
function renderGraph(g){currentGraph=g;const svg=$('graphSvg'),NS='http://www.w3.org/2000/svg';svg.innerHTML='';const defs=document.createElementNS(NS,'defs');defs.innerHTML='<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#92a0b0"/></marker>';svg.appendChild(defs);const order=['regulation','standard','certification','requirement','test_item'],xs={regulation:120,standard:350,certification:590,requirement:825,test_item:1050},grouped={};order.forEach(k=>grouped[k]=[]);(g.nodes||[]).forEach(n=>(grouped[n.node_type]||(grouped[n.node_type]=[])).push(n));const pos={};order.forEach(type=>{const arr=grouped[type]||[];arr.forEach((n,i)=>pos[n.id]={x:xs[type],y:80+(i+1)*(470/(arr.length+1))})});(g.edges||[]).forEach(e=>{if(!pos[e.source]||!pos[e.target])return;const line=document.createElementNS(NS,'line');line.setAttribute('x1',pos[e.source].x+75);line.setAttribute('y1',pos[e.source].y);line.setAttribute('x2',pos[e.target].x-75);line.setAttribute('y2',pos[e.target].y);line.setAttribute('stroke','#9aa8b7');line.setAttribute('stroke-width','1.6');line.setAttribute('marker-end','url(#arrow)');svg.appendChild(line);const text=document.createElementNS(NS,'text');text.setAttribute('x',(pos[e.source].x+pos[e.target].x)/2);text.setAttribute('y',(pos[e.source].y+pos[e.target].y)/2-6);text.setAttribute('text-anchor','middle');text.setAttribute('font-size','10');text.setAttribute('fill','#66778a');text.textContent=e.relation_label||'关联';svg.appendChild(text)});(g.nodes||[]).forEach(n=>{const p=pos[n.id];if(!p)return;const group=document.createElementNS(NS,'g');group.style.cursor='pointer';group.onclick=()=>selectNode(n);const rect=document.createElementNS(NS,'rect');rect.setAttribute('x',p.x-75);rect.setAttribute('y',p.y-29);rect.setAttribute('width','150');rect.setAttribute('height','58');rect.setAttribute('rx','9');rect.setAttribute('fill','#fff');rect.setAttribute('stroke',nodeColor(n.node_type));rect.setAttribute('stroke-width','2');group.appendChild(rect);const t1=document.createElementNS(NS,'text');t1.setAttribute('x',p.x);t1.setAttribute('y',p.y-5);t1.setAttribute('text-anchor','middle');t1.setAttribute('font-size','11');t1.setAttribute('font-weight','700');t1.setAttribute('fill','#23354b');t1.textContent=(n.label||n.name||n.code||typeLabel(n.node_type)).slice(0,19);group.appendChild(t1);const t2=document.createElementNS(NS,'text');t2.setAttribute('x',p.x);t2.setAttribute('y',p.y+13);t2.setAttribute('text-anchor','middle');t2.setAttribute('font-size','9');t2.setAttribute('fill','#718096');t2.textContent=`${n.code||''}${n.version?' · '+n.version:''}`.slice(0,22);group.appendChild(t2);svg.appendChild(group)});if(!(g.nodes||[]).length){const t=document.createElementNS(NS,'text');t.setAttribute('x','590');t.setAttribute('y','300');t.setAttribute('text-anchor','middle');t.setAttribute('fill','#7b8798');t.textContent='当前条件下暂无已确认知识关系';svg.appendChild(t)}}
function selectNode(n){selectedRecordId=n.id;$('impactBtn').style.display='inline-block';$('impactResult').innerHTML='';$('nodeDetail').innerHTML=`<h3>${esc(n.label||n.name||n.code||'知识项')}</h3><div>类型：${esc(typeLabel(n.node_type))}</div><div>编号：${esc(n.code||'未标注')}</div><div>版本：${esc(n.version||'未标注')}</div><div>状态：${esc(lifeLabel(n.lifecycle_state)||n.status||'待确认')}</div><div>地区：${esc(n.region_code||'未标注')}</div><div>产品分类：${esc(n.product_class||'未标注')}</div><div>依据：${n.evidence_backed?'已关联原始依据':'待补充依据'}</div>`}
async function loadGraph(){try{const p=params(),q=new URLSearchParams({region:p.region_code,product_class:p.product_class,as_of:p.as_of||''}),g=await api('/api/graph/project?'+q.toString());$('mNodes').textContent=g.summary?.nodes??(g.nodes||[]).length;$('mEdges').textContent=g.summary?.edges??(g.edges||[]).length;renderGraph(g);await refreshSummary()}catch(e){alert('关系图加载失败：'+e.message)}}
async function loadPaths(){try{const d=await api('/api/graph/path',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(params())});let html=`<span class="pill ${d.status==='ready'?'ok':'warn'}">${d.status==='ready'?'路径已生成':'仍有未连通知识项'}</span><span class="meta">共 ${(d.paths||[]).length} 条路径</span>`;html+=(d.paths||[]).slice(0,30).map((path,i)=>`<div class="path"><b>路径 ${i+1}</b><br>${path.nodes.map(n=>esc(n.label||n.name||n.code||typeLabel(n.node_type))).join(' → ')}<br><span class="meta">${path.edges.map(e=>esc(e.relation_label||e.relation_type||'关联')).join(' → ')}</span></div>`).join('');$('pathResult').innerHTML=html||'<div class="empty">暂无可用路径。</div>'}catch(e){$('pathResult').innerHTML='<div class="empty">路径生成失败：'+esc(e.message)+'</div>'}}
async function runImpact(){if(!selectedRecordId)return;try{const d=await api('/api/graph/impact',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({record_id:selectedRecordId})});let html=`<div class="note">下游可能受影响 ${d.summary?.downstream_count||0} 项，上游关联 ${d.summary?.upstream_count||0} 项。</div>`;html+=(d.downstream||[]).slice(0,30).map(x=>`<div class="impact"><b>${esc(x.name||x.code||'知识项')}</b><br><span class="meta">${esc(typeLabel(x.record_type||x.node_type))}${x.path?` · ${esc(x.path.map(p=>p.relation_label||p.relation_type).join(' → '))}`:''}</span></div>`).join('');$('impactResult').innerHTML=html}catch(e){$('impactResult').innerHTML='<div class="empty">影响分析失败：'+esc(e.message)+'</div>'}}
refreshSummary();loadRelations();loadGraph();
</script>
</body>
</html>
