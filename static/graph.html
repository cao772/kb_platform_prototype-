<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>知识图谱与认证路径 · 通用知识库平台</title>
<style>
:root{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;color:#17243a;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}.top{height:64px;background:#0a2e5e;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 28px}.top a{color:#dbe9fa;text-decoration:none}.wrap{max-width:1500px;margin:20px auto;padding:0 20px}.hero{background:linear-gradient(125deg,#103d78,#0d608b);color:#fff;border-radius:16px;padding:24px 27px;margin-bottom:14px}.hero h1{margin:0 0 7px;font-size:24px}.hero p{margin:0;color:#dceafb;line-height:1.7}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.metric,.card{background:#fff;border:1px solid #e1e7ef;border-radius:12px;box-shadow:0 4px 14px #19304b0a}.metric{padding:13px 15px}.metric span{font-size:12px;color:#7d8999}.metric strong{display:block;font-size:23px;color:#123d6c}.card{padding:16px}.grid{display:grid;grid-template-columns:1.4fr .6fr;gap:14px}.filters{display:grid;grid-template-columns:180px 1fr 180px auto auto;gap:8px;align-items:end;margin-bottom:12px}label{font-size:11px;color:#6e7d91;display:block;margin-bottom:5px}input,select,textarea{width:100%;border:1px solid #cad4e1;border-radius:8px;padding:9px 10px;background:#fff;font:inherit}.btn{border:0;border-radius:8px;background:#0d4f91;color:#fff;padding:9px 13px;cursor:pointer;white-space:nowrap}.btn.secondary{background:#eef4fb;color:#0d4f91}.btn.reject{background:#fbecec;color:#a13b3b}.note{font-size:12px;color:#607087;line-height:1.65;background:#f5f8fc;border-radius:8px;padding:9px 11px}.graphbox{border:1px solid #d9e3ee;border-radius:12px;background:#fbfdff;overflow:auto;min-height:610px}.graphbox svg{display:block;min-width:1050px}.side h2,.card h2{font-size:16px;margin:0 0 12px}.detail{font-size:12px;line-height:1.7;white-space:pre-wrap}.relations{display:flex;flex-direction:column;gap:8px;max-height:520px;overflow:auto}.rel{border:1px solid #dfe6ef;border-radius:9px;padding:9px}.rel b{font-size:12px}.rel p{font-size:12px;color:#5d697b;margin:5px 0}.meta{font-size:11px;color:#8793a3}.actions{display:flex;gap:6px;margin-top:7px}.actions .btn{font-size:11px;padding:6px 9px}.bottom{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.path{border-left:3px solid #6f9ccb;background:#f8fafc;padding:8px 10px;margin:7px 0;border-radius:0 8px 8px 0;font-size:12px;line-height:1.6}.pill{display:inline-block;border-radius:999px;padding:3px 7px;font-size:10px;background:#edf3f8;color:#52657a;margin-right:5px}.ok{background:#eaf8f0;color:#2c7551}.warn{background:#fff3df;color:#956313}.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:#65748a;margin-top:8px}.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:4px}.r{background:#386fa4}.s{background:#4b8f70}.c{background:#c47b32}.q{background:#8b63a8}.t{background:#aa5c67}@media(max-width:1000px){.grid,.bottom{grid-template-columns:1fr}.metrics{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr 1fr}.top{padding:0 14px}}
</style>
</head>
<body>
<div class="top"><b>知识图谱与认证路径</b><a href="/">← 返回通用知识库平台</a></div>
<div class="wrap">
  <div class="hero"><h1>已审核知识节点 + 已审核关系 = 可推理的正式图谱</h1><p>先生成关系候选，再由人工确认“引用、要求、版本替代”等关系。认证路径与影响分析只使用审核通过的关系，不让模型或页面自行拼接事实。</p></div>
  <div class="metrics"><div class="metric"><span>正式关系</span><strong id="mApproved">-</strong></div><div class="metric"><span>待审核关系</span><strong id="mPending">-</strong></div><div class="metric"><span>图谱节点</span><strong id="mNodes">-</strong></div><div class="metric"><span>图谱边</span><strong id="mEdges">-</strong></div></div>
  <div class="card">
    <div class="filters">
      <div><label>国家/地区</label><select id="region"><option value="EU">欧盟 EU</option><option value="US">美国 US</option><option value="CN">中国 CN</option><option value="UK">英国 UK</option><option value="JP">日本 JP</option><option value="KR">韩国 KR</option><option value="CA">加拿大 CA</option><option value="AU">澳大利亚 AU</option><option value="IN">印度 IN</option></select></div>
      <div><label>产品分类</label><input id="productClass" value="家用电器"></div>
      <div><label>判断日期</label><input id="asOf" type="date"></div>
      <button class="btn" onclick="loadGraph()">加载正式图谱</button>
      <button class="btn secondary" onclick="suggestRelations()">生成关系候选</button>
    </div>
    <div class="note">关系候选的置信度只帮助审核排序；未经人工批准，不会出现在下面的正式图谱、认证路径或影响分析中。</div>
  </div>
  <div class="grid" style="margin-top:14px">
    <div class="card"><h2>关系图谱</h2><div class="graphbox"><svg id="graphSvg" width="1180" height="610" viewBox="0 0 1180 610"></svg></div><div class="legend"><span><i class="dot r"></i>法规</span><span><i class="dot s"></i>标准</span><span><i class="dot c"></i>认证</span><span><i class="dot q"></i>要求</span><span><i class="dot t"></i>检测项目</span></div></div>
    <div class="card side"><h2>节点详情 / 影响分析</h2><div id="nodeDetail" class="detail">点击图谱节点查看详情。</div><button id="impactBtn" class="btn secondary" style="margin-top:10px;display:none" onclick="runImpact()">分析变更影响</button><div id="impactResult" class="detail" style="margin-top:10px"></div></div>
  </div>
  <div class="bottom">
    <div class="card"><h2>认证路径</h2><button class="btn" onclick="loadPaths()">生成正式认证路径</button><div id="pathResult" class="detail" style="margin-top:10px">尚未生成。</div></div>
    <div class="card"><h2>关系审核队列</h2><div style="display:flex;gap:8px;margin-bottom:9px"><select id="relationStatus" onchange="loadRelations()"><option value="pending">待审核</option><option value="approved">已通过</option><option value="rejected">已驳回</option><option value="">全部</option></select><button class="btn secondary" onclick="loadRelations()">刷新</button></div><div id="relationList" class="relations"></div></div>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);let selectedRecordId=null;let currentGraph={nodes:[],edges:[]};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,opt){const r=await fetch(url,opt);const data=await r.json();if(!r.ok)throw new Error(data.error||r.statusText);return data}
function params(){return{region_code:$('region').value,product_class:$('productClass').value.trim(),as_of:$('asOf').value||null}}
async function refreshSummary(){const s=await api('/api/graph/summary');$('mApproved').textContent=s.approved;$('mPending').textContent=s.pending}
async function suggestRelations(){try{const p=params();const d=await api('/api/graph/suggest',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});alert(`已生成 ${d.created} 条关系候选`);await Promise.all([refreshSummary(),loadRelations()])}catch(e){alert(e.message)}}
async function loadRelations(){try{const status=encodeURIComponent($('relationStatus').value);const d=await api(`/api/graph/relations?status=${status}`);const box=$('relationList');box.innerHTML='';if(!d.items.length){box.textContent='当前没有关系记录。';return}d.items.forEach(x=>{const div=document.createElement('div');div.className='rel';div.innerHTML=`<b>${esc(x.source_code||x.source_name)} → ${esc(x.relation_label)} → ${esc(x.target_code||x.target_name)}</b><p>${esc(x.source_name)} → ${esc(x.target_name)}</p><div class="meta">置信度 ${Number(x.confidence||0).toFixed(2)} · ${esc(x.status)}</div>`;if(x.status==='pending'){const actions=document.createElement('div');actions.className='actions';const a=document.createElement('button');a.className='btn';a.textContent='通过';a.onclick=()=>reviewRelation(x.id,'approve');const r=document.createElement('button');r.className='btn reject';r.textContent='驳回';r.onclick=()=>reviewRelation(x.id,'reject');actions.append(a,r);div.appendChild(actions)}box.appendChild(div)})}catch(e){$('relationList').textContent=e.message}}
async function reviewRelation(id,action){try{await api('/api/graph/review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({relation_id:id,action})});await Promise.all([loadRelations(),refreshSummary(),loadGraph()])}catch(e){alert(e.message)}}
function nodeColor(type){return{regulation:'#386fa4',standard:'#4b8f70',certification:'#c47b32',requirement:'#8b63a8',test_item:'#aa5c67'}[type]||'#66788a'}
function renderGraph(g){currentGraph=g;const svg=$('graphSvg');svg.innerHTML='';const NS='http://www.w3.org/2000/svg';const defs=document.createElementNS(NS,'defs');defs.innerHTML='<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#92a0b0"/></marker>';svg.appendChild(defs);const order=['regulation','standard','certification','requirement','test_item'];const x={regulation:120,standard:350,certification:590,requirement:825,test_item:1030};const grouped={};order.forEach(k=>grouped[k]=[]);g.nodes.forEach(n=>(grouped[n.node_type]||(grouped[n.node_type]=[])).push(n));const pos={};order.forEach(type=>{const arr=grouped[type]||[];arr.forEach((n,i)=>{const y=70+(i+1)*(500/(arr.length+1));pos[n.id]={x:x[type]||590,y}})});g.edges.forEach(e=>{if(!pos[e.source]||!pos[e.target])return;const line=document.createElementNS(NS,'line');line.setAttribute('x1',pos[e.source].x+76);line.setAttribute('y1',pos[e.source].y);line.setAttribute('x2',pos[e.target].x-76);line.setAttribute('y2',pos[e.target].y);line.setAttribute('stroke','#9aa8b7');line.setAttribute('stroke-width','1.6');line.setAttribute('marker-end','url(#arrow)');svg.appendChild(line);const text=document.createElementNS(NS,'text');text.setAttribute('x',(pos[e.source].x+pos[e.target].x)/2);text.setAttribute('y',(pos[e.source].y+pos[e.target].y)/2-5);text.setAttribute('text-anchor','middle');text.setAttribute('font-size','10');text.setAttribute('fill','#66778a');text.textContent=e.relation_label;svg.appendChild(text)});g.nodes.forEach(n=>{const p=pos[n.id];const group=document.createElementNS(NS,'g');group.style.cursor='pointer';group.onclick=()=>selectNode(n);const rect=document.createElementNS(NS,'rect');rect.setAttribute('x',p.x-76);rect.setAttribute('y',p.y-25);rect.setAttribute('width','152');rect.setAttribute('height','50');rect.setAttribute('rx','9');rect.setAttribute('fill','#fff');rect.setAttribute('stroke',nodeColor(n.node_type));rect.setAttribute('stroke-width','2');group.appendChild(rect);const t1=document.createElementNS(NS,'text');t1.setAttribute('x',p.x);t1.setAttribute('y',p.y-4);t1.setAttribute('text-anchor','middle');t1.setAttribute('font-size','11');t1.setAttribute('font-weight','700');t1.setAttribute('fill','#23354b');t1.textContent=(n.code||n.label).slice(0,20);group.appendChild(t1);const t2=document.createElementNS(NS,'text');t2.setAttribute('x',p.x);t2.setAttribute('y',p.y+13);t2.setAttribute('text-anchor','middle');t2.setAttribute('font-size','9');t2.setAttribute('fill','#718096');t2.textContent=`${n.version||'未标版本'} · ${n.lifecycle_state}`;group.appendChild(t2);svg.appendChild(group)})}
function selectNode(n){selectedRecordId=n.id;$('impactBtn').style.display='inline-block';$('impactResult').textContent='';$('nodeDetail').textContent=`${n.label}\n类型：${n.node_type}\n编号：${n.code||'-'}\n版本：${n.version||'-'}\n状态：${n.status} / ${n.lifecycle_state}\n地区：${n.region_code}\n产品分类：${n.product_class||'-'}\n证据：${n.evidence_backed?'已关联':'待补充'}`}
async function loadGraph(){try{const p=params();const q=new URLSearchParams({region:p.region_code,product_class:p.product_class,as_of:p.as_of||''});const g=await api('/api/graph/project?'+q.toString());$('mNodes').textContent=g.summary.nodes;$('mEdges').textContent=g.summary.edges;renderGraph(g);await refreshSummary()}catch(e){alert(e.message)}}
async function loadPaths(){try{const p=params();const d=await api('/api/graph/path',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});let html=`<span class="pill ${d.status==='ready'?'ok':'warn'}">${esc(d.status)}</span> 路径 ${d.summary.paths} 条，未连通节点 ${d.summary.unconnected_targets} 个。<br><br>`;html+=(d.paths||[]).slice(0,30).map((path,i)=>`<div class="path"><b>路径 ${i+1}</b><br>${path.nodes.map(n=>esc(n.code||n.label)).join(' → ')}<br><span class="meta">${path.edges.map(e=>esc(e.relation_label)).join(' / ')}</span></div>`).join('');if(!d.paths.length)html+=esc(d.next_action);$('pathResult').innerHTML=html}catch(e){$('pathResult').textContent=e.message}}
async function runImpact(){if(!selectedRecordId)return;try{const d=await api('/api/graph/impact',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({record_id:selectedRecordId})});$('impactResult').textContent=`下游影响 ${d.summary.downstream_count} 个，上游依赖 ${d.summary.upstream_count} 个\n影响类型：${JSON.stringify(d.summary.affected_types)}\n\n下游：\n${d.downstream.map(x=>`D${x.depth} ${x.record.code||x.record.name}`).join('\n')||'无'}\n\n${d.interpretation}`}catch(e){$('impactResult').textContent=e.message}}
(function init(){const now=new Date();$('asOf').value=now.toISOString().slice(0,10);Promise.all([refreshSummary(),loadRelations(),loadGraph()])})();
</script>
</body>
</html>
