<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>候选知识术语归一 · 法规认证知识平台</title>
<style>
:root{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;color:#17243a;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}.top{height:64px;background:#0a2e5e;color:white;display:flex;align-items:center;justify-content:space-between;padding:0 28px}.top a{color:#dce8f5;text-decoration:none}.wrap{max-width:1450px;margin:18px auto;padding:0 20px}.card{background:white;border:1px solid #e1e7ef;border-radius:12px;padding:16px}.hero h1{margin:0 0 7px;font-size:24px;color:#113f72}.hero p{margin:0;color:#66758a;line-height:1.7}.layout{display:grid;grid-template-columns:360px 1fr;gap:14px;margin-top:14px}.item{border:1px solid #dfe6ef;border-radius:9px;padding:10px;margin:8px 0;cursor:pointer}.item.active,.item:hover{border-color:#76a1ca;background:#f8fbff}.item b{font-size:13px}.meta{font-size:11px;color:#7c8998;line-height:1.6;margin-top:4px}.field{margin-top:10px}.field label{display:block;font-size:11px;color:#718095;margin-bottom:5px}input,select,textarea{width:100%;border:1px solid #cad4e1;border-radius:8px;padding:9px 10px;background:white;font:inherit}textarea{min-height:74px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.wide{grid-column:1/-1}.suggest{background:#f4f8fd;border:1px solid #dce8f6;border-radius:8px;padding:9px;font-size:12px;color:#526983;line-height:1.6;margin-top:7px}.btn{border:0;border-radius:8px;background:#0d4f91;color:white;padding:9px 13px;cursor:pointer}.btn.secondary{background:#eef4fb;color:#0d4f91}.btn.danger{background:#fcecec;color:#963b3b}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}.empty{padding:25px;text-align:center;color:#8491a2}.pill{display:inline-block;font-size:10px;padding:3px 7px;border-radius:999px;background:#eef3f8;color:#5f6f82}.note{background:#fff8e8;border:1px solid #f0dfae;border-radius:8px;padding:10px;font-size:12px;color:#765d1d;line-height:1.65}@media(max-width:900px){.layout,.grid{grid-template-columns:1fr}.wide{grid-column:auto}.top{padding:0 14px}.wrap{padding:0 12px}}
</style>
</head>
<body>
<div class="top"><div style="font-size:19px;font-weight:700">法规认证知识平台 · 候选术语归一</div><div><a href="/ontology-governance">本体维护</a>　<a href="/">返回平台</a></div></div>
<div class="wrap">
  <div class="card hero"><h1>候选知识术语归一与人工复核</h1><p>系统根据本体术语、同义词和21国主数据给出规范化建议。业务人员可修改后保存，也可继续批准或驳回；任何自动归一都不会跳过人工复核。</p></div>
  <div class="layout">
    <div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><b>待校核候选</b><button class="btn secondary" onclick="loadPending()">刷新</button></div><div id="pending"><div class="empty">正在加载…</div></div></div>
    <div class="card">
      <div id="detail"><div class="empty">选择左侧候选查看术语归一建议。</div></div>
    </div>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,opt){const r=await fetch(url,opt);const d=await r.json();if(!r.ok||d.error)throw new Error(d.error||'请求失败');return d}
let currentTask=0,currentData=null;
async function loadPending(){try{const d=await api('/api/candidate-normalization/pending?limit=200');$('pending').innerHTML=(d.items||[]).map(x=>'<div class="item '+(Number(x.task_id)===Number(currentTask)?'active':'')+'" onclick="showTask('+x.task_id+')"><b>'+esc(x.candidate_name||'未命名')+'</b><div class="meta">'+esc(x.candidate_type)+' · '+esc(x.filename)+'</div><div class="meta">可归一字段 '+Number(x.suggested_fields||0)+' · 置信度 '+Math.round(Number(x.confidence||0)*100)+'%</div></div>').join('')||'<div class="empty">当前没有待校核候选。</div>'}catch(e){$('pending').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
function bestMatch(field){const m=currentData?.fields?.[field]?.matches||[];return m[0]||null}
function renderDetail(){const d=currentData,p=d.candidate||{},f=d.fields||{},attrs=p.attributes||{},rt=bestMatch('record_type'),pc=bestMatch('product_class'),au=bestMatch('authority'),rg=f.region||{};$('detail').innerHTML='<div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0;font-size:17px">候选 #'+d.task_id+'</h2><span class="pill">仍为待校核</span></div><div class="meta">'+esc(d.filename||'')+'</div><div class="note" style="margin-top:10px">自动建议只用于辅助归一。这里保存后仍不会进入正式知识库，只有点击“批准为正式知识”并完成人工确认后才会进入。</div><div class="grid"><div class="field"><label>知识类型</label><input id="nType" value="'+esc(rt?.code||p.record_type||'')+'"><div class="suggest">原值：'+esc(p.record_type||'')+(rt?'；建议：'+esc(rt.canonical_name)+'（'+esc(rt.code||'')+'）':'；暂无术语建议')+'</div></div><div class="field"><label>国家/地区代码</label><input id="nRegionCode" value="'+esc(rg.canonical_code||p.region_code||'')+'"><div class="suggest">原值：'+esc(p.region_code||'')+(rg.canonical_code?'；规范：'+esc(rg.canonical_code)+' '+esc(rg.canonical_name||''):'；未识别到21国主数据')+'</div></div><div class="field"><label>国家/地区名称</label><input id="nRegionName" value="'+esc(rg.canonical_name||p.region_name||'')+'"></div><div class="field"><label>产品分类</label><input id="nProductClass" value="'+esc(pc?.canonical_name||p.product_class||'')+'"><div class="suggest">原值：'+esc(p.product_class||'')+(pc?'；规范词：'+esc(pc.canonical_name):'；可在本体维护中补充产品分类术语')+'</div></div><div class="field wide"><label>主管机构</label><input id="nAuthority" value="'+esc(au?.canonical_name||attrs.authority||'')+'"><div class="suggest">原值：'+esc(attrs.authority||'')+(au?'；规范词：'+esc(au.canonical_name):'；可在本体维护中补充主管机构别名')+'</div></div><div class="field wide"><label>候选名称（最终人工可改）</label><input id="nName" value="'+esc(p.name||'')+'"></div><div class="field"><label>编号</label><input id="nCode" value="'+esc(p.code||'')+'"></div><div class="field"><label>版本</label><input id="nVersion" value="'+esc(p.version||'')+'"></div><div class="field wide"><label>复核人</label><input id="nOperator" value="'+esc(localStorage.getItem('normalization_operator')||'')+'"></div><div class="field wide"><label>说明</label><textarea id="nNote" placeholder="例如：已核对英文简称与本体规范词，保留法规编号原文。"></textarea></div></div><div class="actions"><button class="btn secondary" onclick="saveNormalization()">保存归一结果</button><button class="btn" onclick="finalReview('approve')">批准为正式知识</button><button class="btn danger" onclick="finalReview('reject')">驳回候选</button><span id="result" class="meta"></span></div>'}
async function showTask(id){currentTask=Number(id);try{currentData=await api('/api/candidate-normalization?task_id='+id);renderDetail();loadPending()}catch(e){$('detail').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
function changes(){return{record_type:$('nType').value.trim(),region_code:$('nRegionCode').value.trim(),region_name:$('nRegionName').value.trim(),product_class:$('nProductClass').value.trim(),authority:$('nAuthority').value.trim()}}
async function saveNormalization(){try{const operator=$('nOperator').value.trim(),note=$('nNote').value.trim();if(operator)localStorage.setItem('normalization_operator',operator);await api('/api/candidate-normalization/apply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({task_id:currentTask,changes:changes(),operator,note})});$('result').textContent='归一结果已保存，候选仍待人工批准。';await showTask(currentTask)}catch(e){$('result').textContent='保存失败：'+e.message}}
async function finalReview(action){try{const operator=$('nOperator').value.trim(),note=$('nNote').value.trim();if(operator)localStorage.setItem('normalization_operator',operator);const edits={...changes(),name:$('nName').value.trim(),code:$('nCode').value.trim(),version:$('nVersion').value.trim()};await api('/api/extraction/review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({task_id:currentTask,action,edits,note:(operator?('复核人：'+operator+'；'):'')+note})});$('result').textContent=action==='approve'?'已人工批准并进入正式知识库。':'已驳回候选。';currentTask=0;currentData=null;$('detail').innerHTML='<div class="empty">本条已处理，请选择下一条。</div>';loadPending()}catch(e){$('result').textContent='处理失败：'+e.message}}
loadPending();
</script>
</body>
</html>
